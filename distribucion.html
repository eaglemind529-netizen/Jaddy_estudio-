```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaddy Studio - Distribución</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #050505; color: #fff; }
        .glass { background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        input, select { 
            background: rgba(255,255,255,0.03) !important; 
            border: 1px solid rgba(255,255,255,0.1) !important; 
            color: white !important;
            padding: 16px !important;
            border-radius: 16px !important;
            width: 100%;
        }
        input:focus { border-color: #ea580c !important; outline: none; }
        .btn-primary { background: #ea580c; color: white; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; transition: 0.2s; }
        .btn-primary:hover { background: #f97316; transform: translateY(-2px); }
        .locked-screen { position: fixed; inset: 0; z-index: 100; background: #050505; display: flex; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body>

    <!-- BLOQUEO -->
    <div id="lock-screen" class="locked-screen">
        <div class="max-w-md w-full glass p-10 rounded-[3rem] text-center space-y-8 border-orange-500/20">
            <div class="w-20 h-20 bg-orange-600 rounded-[2rem] flex items-center justify-center mx-auto shadow-2xl shadow-orange-600/20">
                <i data-lucide="lock" class="w-10 h-10 text-white"></i>
            </div>
            <div>
                <h2 class="text-3xl font-black italic uppercase tracking-tighter">Acceso <span class="text-orange-500">Privado</span></h2>
            </div>
            <div class="space-y-4">
                <input type="email" id="auth-email" placeholder="Tu Correo Autorizado">
                <input type="password" id="auth-pin" placeholder="Tu PIN de Acceso">
                <button onclick="window.verificarAcceso()" id="btn-login" class="btn-primary w-full py-5 rounded-2xl text-[10px]">Verificar Acceso</button>
            </div>
            <p id="auth-error" class="text-red-500 text-[10px] font-bold hidden">ACCESO DENEGADO</p>
            <div class="pt-4 border-t border-white/5">
                <button onclick="window.solicitarAcceso()" class="text-white border border-white/10 w-full py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-white hover:text-black transition-all">Solicitar Acceso (WhatsApp)</button>
            </div>
        </div>
    </div>

    <!-- CONTENIDO -->
    <div id="main-content" class="hidden">
        <nav class="p-6 border-b border-white/5 glass sticky top-0 z-50 flex justify-between items-center">
            <span class="font-black uppercase italic text-xl tracking-tighter">Jaddy <span class="text-orange-500">Distro</span></span>
            <button onclick="location.reload()" class="text-neutral-500 hover:text-white"><i data-lucide="log-out"></i></button>
        </nav>

        <main class="max-w-3xl mx-auto px-6 py-12">
            <div class="glass p-8 md:p-12 rounded-[3rem] border border-orange-500/20">
                <form id="uploadForm" class="space-y-8">
                    <div class="space-y-6">
                        <h3 class="text-orange-500 text-[10px] font-black uppercase tracking-widest border-b border-orange-500/20 pb-2">Material de Lanzamiento</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <input type="text" id="track-name" placeholder="Título de la Canción" required>
                            <select id="track-genre">
                                <option>Reggaeton</option>
                                <option>Trap / Drill</option>
                                <option>Afrobeat</option>
                            </select>
                        </div>
                        <div class="space-y-4">
                            <input type="url" id="link-wav" placeholder="Link WAV (Drive/Dropbox)" required>
                            <input type="url" id="link-art" placeholder="Link Portada (3000x3000px)" required>
                        </div>
                    </div>
                    <button type="submit" id="btn-submit" class="btn-primary w-full py-6 rounded-[2rem] text-xs">Enviar al Sello</button>
                </form>

                <div id="success-view" class="hidden text-center py-10">
                    <i data-lucide="check-circle" class="w-16 h-16 text-green-500 mx-auto mb-4"></i>
                    <h2 class="text-2xl font-black uppercase italic">¡Enviado con éxito!</h2>
                    <p class="text-neutral-500 text-[10px] uppercase font-bold mt-2">Estamos revisando tu material.</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "jaddy-distro-master";
        
        let artistaActual = null;
        let globalSettings = { whatsapp: '584120000000' };

        signInAnonymously(auth).then(async () => {
            const sDoc = await getDoc(doc(db, 'artifacts', appId, 'public', 'settings', 'global'));
            if(sDoc.exists()) globalSettings = sDoc.data();
        });

        window.verificarAcceso = async () => {
            const email = document.getElementById('auth-email').value.toLowerCase().trim();
            const pin = document.getElementById('auth-pin').value.trim();
            const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'artistas_autorizados'));
            const user = snap.docs.find(d => d.data().email === email && d.data().pin === pin);

            if(user) {
                artistaActual = user.data();
                document.getElementById('lock-screen').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
            } else {
                document.getElementById('auth-error').classList.remove('hidden');
            }
        };

        window.solicitarAcceso = () => {
            const text = "¡Hola Jaddy Studio! Deseo solicitar acceso al portal de distribución.";
            window.open(`https://wa.me/${globalSettings.whatsapp.replace(/\D/g,'')}?text=${encodeURIComponent(text)}`, '_blank');
        };

        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.innerText = "ENVIANDO...";
            btn.disabled = true;

            await addDoc(collection(db, 'artifacts', appId, 'public', 'lanzamientos'), {
                artista: artistaActual.nombre,
                email: artistaActual.email,
                cancion: document.getElementById('track-name').value,
                genero: document.getElementById('track-genre').value,
                linkWav: document.getElementById('link-wav').value,
                linkArt: document.getElementById('link-art').value,
                fecha: serverTimestamp()
            });
            document.getElementById('uploadForm').classList.add('hidden');
            document.getElementById('success-view').classList.remove('hidden');
        };

        lucide.createIcons();
    </script>
</body>
</html>

```
