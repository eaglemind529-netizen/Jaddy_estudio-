    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0a0a0a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-card {
            background: rgba(23, 23, 23, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #a855f7 0%, #7e22ce 100%);
            box-shadow: 0 10px 20px -5px rgba(168, 85, 247, 0.4);
        }

        .neo-input {
            background: #171717;
            border: 2px solid #262626;
            color: white;
            padding: 1rem;
            border-radius: 16px;
            width: 100%;
        }

        .neo-input:focus {
            border-color: #a855f7;
            outline: none;
        }

        /* Animación para notificaciones */
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast { animation: slideUp 0.3s ease-out; }

        /* Estilo para el scroll */
        ::-webkit-scrollbar { width: 0px; }
    </style>
</head>
<body class="pb-32">

    <!-- Notificación -->
    <div id="toast" class="fixed bottom-24 left-4 right-4 z-[100] hidden">
        <div class="toast bg-white text-black p-4 rounded-2xl shadow-2xl flex items-center justify-center font-bold text-sm uppercase tracking-widest">
            <span id="toast-text">Actualizado</span>
        </div>
    </div>

    <!-- Header -->
    <header class="p-6 pt-10">
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-3xl font-extrabold tracking-tighter">JADDY<span class="text-purple-500">ADMIN</span></h1>
            <div id="db-dot" class="w-3 h-3 rounded-full bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.5)]"></div>
        </div>
        <p class="text-xs text-gray-500 font-bold uppercase tracking-widest">Panel de Control Maestro</p>
    </header>

    <main class="px-4 space-y-6">
        
        <!-- Stats Rápidas -->
        <div class="grid grid-cols-2 gap-4">
            <div class="glass-card p-6 border-b-2 border-purple-500">
                <p class="text-[10px] font-bold text-gray-500 uppercase mb-1">Total Beats</p>
                <p id="count-beats" class="text-3xl font-extrabold italic">0</p>
            </div>
            <div class="glass-card p-6 border-b-2 border-blue-500">
                <p class="text-[10px] font-bold text-gray-500 uppercase mb-1">Pagos Activos</p>
                <p id="count-pay" class="text-3xl font-extrabold italic">0</p>
            </div>
        </div>

        <!-- SECCIÓN: MÉTODOS DE PAGO -->
        <section class="space-y-4">
            <div class="flex items-center justify-between px-2">
                <h2 class="text-lg font-extrabold uppercase italic tracking-tight">Métodos de Pago</h2>
                <button onclick="openModal('modal-pay')" class="text-purple-500 font-bold text-xs uppercase underline">Añadir</button>

            <!-- Botón Grande para añadir pago (Más visible) -->
            <button onclick="openModal('modal-pay')" class="w-full py-4 bg-white/5 border-2 border-dashed border-white/10 rounded-2xl flex items-center justify-center gap-3 text-gray-400 font-bold text-sm uppercase">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="2" stroke-linecap="round"></path></svg>
                Nueva Opción de Pago
            </button>

            <div id="pay-list" class="space-y-3">
                <!-- Se cargan dinámicamente -->

        </section>

        <!-- SECCIÓN: BEATS -->
        <section class="space-y-4">

            <div id="beat-list" class="space-y-3 text-center">
                <p class="text-gray-600 text-[10px] uppercase py-10 font-bold">Cargando catálogo...</p>
            </div>
        </section>

    </main>

    <!-- BARRA DE NAVEGACIÓN INFERIOR (CÓMODA PARA MÓVIL) -->
    <nav class="fixed bottom-0 left-0 right-0 p-4 bg-black/80 backdrop-blur-xl border-t border-white/5 z-50 flex justify-around items-center">
        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="p-4 text-gray-500">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-width="2"></path></svg>
        </button>
        
        <!-- Botón Central Flotante para añadir Beat -->
        <button onclick="openModal('modal-beat')" class="btn-primary -mt-12 w-16 h-16 rounded-full flex items-center justify-center text-white shadow-2xl">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="3" stroke-linecap="round"></path></svg>
        </button>

        <button onclick="location.reload()" class="p-4 text-gray-500">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-width="2"></path></svg>
        </button>
    </nav>

    <!-- MODAL: AGREGAR PAGO -->
    <div id="modal-pay" class="fixed inset-0 z-[120] hidden items-end sm:items-center justify-center p-4 bg-black/90 backdrop-blur-sm">
        <div class="glass-card w-full max-w-md p-8 bg-neutral-900 border-t-4 border-purple-500">
            <h3 class="text-2xl font-black italic uppercase mb-6">Nuevo <span class="text-purple-500">Pago</span></h3>
            <form id="form-pay" class="space-y-4">
                <input id="p_title" required class="neo-input font-bold" placeholder="Nombre (Ej: Pago Móvil)">
                <textarea id="p_desc" required class="neo-input h-32 text-sm font-medium" placeholder="Cédula, Banco, Teléfono..."></textarea>
                <div class="flex gap-2">
                    <button type="button" onclick="closeModal('modal-pay')" class="flex-1 py-4 text-xs font-bold uppercase text-gray-500">Cerrar</button>
                    <button type="submit" class="flex-[2] btn-primary py-4 rounded-xl font-bold uppercase text-xs tracking-widest">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: AGREGAR BEAT -->
    <div id="modal-beat" class="fixed inset-0 z-[120] hidden items-end sm:items-center justify-center p-4 bg-black/90 backdrop-blur-sm">
        <div class="glass-card w-full max-w-md p-8 bg-neutral-900 border-t-4 border-blue-500">
            <h3 class="text-2xl font-black italic uppercase mb-6">Subir <span class="text-blue-500">Beat</span></h3>
            <form id="form-beat" class="space-y-4">
                <input id="b_name" required class="neo-input font-bold" placeholder="Título del Beat">
                <div class="grid grid-cols-2 gap-2">
                    <select id="b_type" class="neo-input text-xs font-bold">
                        <option value="paid">Premium</option>
                        <option value="free">Gratis</option>
                    </select>
                    <input id="b_price" type="number" class="neo-input font-bold" placeholder="Precio $">
                </div>
                <input id="b_genre" required class="neo-input font-bold" placeholder="Género">
                <input id="b_link" required type="url" class="neo-input text-xs" placeholder="Enlace del archivo">
                <div class="flex gap-2 pt-2">
                    <button type="button" onclick="closeModal('modal-beat')" class="flex-1 py-4 text-xs font-bold uppercase text-gray-500">Cancelar</button>
                    <button type="submit" class="flex-[2] btn-primary py-4 rounded-xl font-bold uppercase text-xs tracking-widest">Publicar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, doc, setDoc, collection, addDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDIaAvpJZrJjQUKsh6KGD7gALJNskto8A8",
            authDomain: "jaddy-estudio.firebaseapp.com",
            projectId: "jaddy-estudio",
            storageBucket: "jaddy-estudio.firebasestorage.app",
            messagingSenderId: "968903268866",
            appId: "1:968903268866:web:e2b6895e8acff18178e51b"
        };

        const APP_ID = "jaddy_studio_v1";
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // UI Helpers
        window.openModal = (id) => {
            const m = document.getElementById(id);
            m.classList.remove('hidden');
            m.classList.add('flex');
        };
        window.closeModal = (id) => {
            const m = document.getElementById(id);
            m.classList.add('hidden');
            m.classList.remove('flex');
        };

        const showNotice = (txt) => {
            const t = document.getElementById('toast');
            document.getElementById('toast-text').innerText = txt;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2500);
        };

        // Firebase Auth & Listeners
        const init = async () => {
            try {
                await signInAnonymously(auth);
                document.getElementById('db-dot').classList.replace('bg-red-500', 'bg-green-500');
                listenPayments();
                listenBeats();
            } catch (e) { console.error(e); }
        };

        const listenPayments = () => {
            onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'methods'), (snap) => {
                const list = document.getElementById('pay-list');
                document.getElementById('count-pay').innerText = snap.size;
                list.innerHTML = "";
                snap.forEach(d => {
                    const pay = d.data();
                    const el = document.createElement('div');
                    el.className = "glass-card p-5 flex justify-between items-center group";
                    el.innerHTML = `
                        <div>
                            <p class="text-xs font-black text-purple-400 uppercase tracking-tighter">${pay.title}</p>
                            <p class="text-[10px] text-gray-500 font-medium mt-1 truncate max-w-[200px]">${pay.desc}</p>
                        </div>
                        <button onclick="window.delPay('${d.id}')" class="p-2 text-gray-700 hover:text-red-500">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2"></path></svg>
                        </button>
                    `;
                    list.appendChild(el);
                });
            });
        };

        const listenBeats = () => {
            onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'beats'), (snap) => {
                const list = document.getElementById('beat-list');
                document.getElementById('count-beats').innerText = snap.size;
                list.innerHTML = "";
                snap.forEach(d => {
                    const beat = d.data();
                    const el = document.createElement('div');
                    el.className = "glass-card p-5 flex justify-between items-center";
                    el.innerHTML = `
                        <div class="flex items-center gap-4 text-left">
                            <div class="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center text-[10px] font-black text-blue-400">
                                ${beat.type === 'free' ? 'FREE' : '$'}
                            </div>
                            <div>
                                <p class="text-xs font-bold uppercase tracking-tight">${beat.name}</p>
                                <p class="text-[9px] text-gray-500 uppercase">${beat.genre}</p>
                            </div>
                        </div>
                        <button onclick="window.delBeat('${d.id}')" class="p-2 text-gray-700">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="2"></path></svg>
                        </button>
                    `;
                    list.appendChild(el);
                });
            });
        };

        // Actions
        window.delPay = async (id) => { if(confirm("¿Eliminar pago?")) await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'methods', id)); showNotice("PAGO ELIMINADO"); };
        window.delBeat = async (id) => { if(confirm("¿Eliminar beat?")) await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'beats', id)); showNotice("BEAT ELIMINADO"); };

        document.getElementById('form-pay').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'methods'), {
                title: document.getElementById('p_title').value,
                desc: document.getElementById('p_desc').value,
                created: Date.now()
            });
            showNotice("PAGO GUARDADO");
            e.target.reset();
            closeModal('modal-pay');
        };

        document.getElementById('form-beat').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'beats'), {
                name: document.getElementById('b_name').value,
                type: document.getElementById('b_type').value,
                price: document.getElementById('b_price').value || 0,
                genre: document.getElementById('b_genre').value,
                link: document.getElementById('b_link').value,
                created: Date.now()
            });
            showNotice("BEAT PUBLICADO");
            e.target.reset();
            closeModal('modal-beat');
        };

        init();
    </script>
</body>
</html>
