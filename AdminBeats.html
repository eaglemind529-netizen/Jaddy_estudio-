        body {

            -webkit-tap-highlight-color: transparent;
        }

        /* Estilo Jaddy Studio (Purple & Dark) */
        .brand-text {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-bg {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
        }

        .glass-card {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        }

        @keyframes pulse-purple {
            0% { opacity: 1; }
            50% { opacity: 0.5; }

        .loading-pulse { animation: pulse-purple 1.5s infinite; }

        .form-input {

        .modal {

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // Configuración de Firebase heredada
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'jaddy-records-v2';

        let currentUser = null;
        let selectedImageData = null;
        let selectedAudioData = null;
        let isPlaying = false;
        let currentPlayingId = null;

        const audioEngine = document.getElementById('main-audio');

        // Lógica de UI para Categorías
        document.getElementById('beat-category-input').onchange = (e) => {
            const isVenta = e.target.value === 'venta';
            document.getElementById('price-container').style.opacity = isVenta ? "1" : "0.3";
            document.getElementById('payment-methods-container').style.opacity = isVenta ? "1" : "0.3";
        };

        // Autenticación
        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };
        initAuth();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                const beatsRef = collection(db, 'artifacts', appId, 'public', 'data', 'beats');
                onSnapshot(beatsRef, (snap) => {
                    const beats = [];
                    snap.forEach(d => beats.push({id: d.id, ...d.data()}));
                    document.getElementById('counter').innerText = `${beats.length} TRACKS EN LÍNEA`;
                    renderBeats(beats.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)));
                }, (err) => console.error(err));
            }
        });

        function renderBeats(beats) {
            const container = document.getElementById('wall-container');
            container.innerHTML = beats.map(b => {
                const isCurrent = currentPlayingId === b.id;
                let badge = b.category === 'free' ? 'FREE' : (b.category === 'exclusivo' ? 'EXCL' : `$${b.price}`);
                
                return `
                    <div class="glass-card rounded-[2rem] overflow-hidden group border ${isCurrent ? 'border-purple-500' : 'border-white/5'}">
                        <div class="relative aspect-square cursor-pointer" onclick="handlePlay('${b.id}', '${b.audio}', '${b.image}', '${b.name}', '${b.producer}')">
                            <img src="${b.image || 'https://via.placeholder.com/300'}" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity backdrop-blur-[2px]">
                                <i class="fa-solid ${isCurrent && isPlaying ? 'fa-pause' : 'fa-play'} text-2xl"></i>
                            </div>
                            <div class="absolute top-4 left-4">
                                <span class="status-badge brand-bg text-white shadow-lg">${badge}</span>
                            </div>
                        </div>
                        <div class="p-5">
                            <h3 class="font-black uppercase italic text-[11px] truncate mb-1 ${isCurrent ? 'brand-text' : ''}">${b.name}</h3>
                            <p class="text-[8px] font-bold uppercase tracking-widest text-zinc-500 truncate mb-4">${b.producer || 'JADDY'}</p>
                            
                            <div class="flex justify-between items-center pt-2 border-t border-white/5">
                                <button onclick="openContactModal('${b.id}')" class="text-[8px] font-black uppercase text-purple-400 bg-purple-500/10 px-4 py-1.5 rounded-full hover:bg-purple-500/20 transition-all">
                                    INFO
                                </button>
                                <button onclick="deleteBeat('${b.id}')" class="w-8 h-8 rounded-full flex items-center justify-center text-zinc-600 hover:text-red-500 hover:bg-red-500/10 transition-all">
                                    <i class="fa-solid fa-trash-can text-[11px]"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // REPRODUCTOR
        window.handlePlay = (id, audio, img, name, producer) => {
            const player = document.getElementById('mini-player');
            if (currentPlayingId === id) {
                if (isPlaying) {
                    audioEngine.pause();
                    isPlaying = false;
                } else {
                    audioEngine.play();
                    isPlaying = true;
                }
            } else {
                currentPlayingId = id;
                audioEngine.src = audio;
                audioEngine.play();
                isPlaying = true;
                
                document.getElementById('player-img').src = img;
                document.getElementById('player-name').innerText = name;
                player.style.translate = "0 -20px";
                player.style.opacity = "1";
            }
            updatePlayBtn();
        };

        function updatePlayBtn() {
            const btn = document.getElementById('btn-play-pause');
            btn.innerHTML = isPlaying ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play ml-1"></i>';
        }

        audioEngine.ontimeupdate = () => {
            const prog = (audioEngine.currentTime / audioEngine.duration) * 100;
            document.getElementById('progress-bar').style.width = prog + "%";
        };

        // MODAL
        window.openContactModal = (id) => {
            const beatsRef = collection(db, 'artifacts', appId, 'public', 'data', 'beats');
            onSnapshot(beatsRef, (snap) => {
                snap.forEach(d => {
                    if(d.id === id) {
                        const b = d.data();
                        document.getElementById('modal-beat-name').innerText = b.name;
                        document.getElementById('modal-beat-price').innerText = b.category === '
