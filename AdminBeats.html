    <audio id="main-audio"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'jaddy-records-v2';

        let currentUser = null;
        let selectedImageData = null;
        let selectedAudioData = null;
        let isPlaying = false;
        let currentPlayingId = null;

        const audioEngine = document.getElementById('main-audio');

        // CATEGORY TOGGLE
        document.getElementById('beat-category-input').onchange = (e) => {
            const isVenta = e.target.value === 'venta';
            document.getElementById('price-container').style.opacity = isVenta ? "1" : "0.3";
            document.getElementById('payment-methods-container').style.opacity = isVenta ? "1" : "0.3";
        };

        // AUTH
        const initAuth = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };
        initAuth();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                const beatsRef = collection(db, 'artifacts', appId, 'public', 'data', 'beats');
                onSnapshot(beatsRef, (snap) => {
                    const beats = [];
                    snap.forEach(d => beats.push({id: d.id, ...d.data()}));
                    renderBeats(beats.sort((a,b) => b.createdAt - a.createdAt));
                }, (err) => console.error(err));
            }
        });

        function renderBeats(beats) {
            const container = document.getElementById('wall-container');
            container.innerHTML = beats.map(b => {
                const isCurrent = currentPlayingId === b.id;
                let badge = b.category === 'free' ? 'FREE' : (b.category === 'exclusivo' ? 'EXCL' : `$${b.price}`);
                
                return `
                    <div class="glass-card rounded-[1.8rem] overflow-hidden group border ${isCurrent ? 'border-yellow-500' : 'border-white/5'}">
                        <div class="relative aspect-square cursor-pointer" onclick="handlePlay('${b.id}')">
                            <img src="${b.image}" class="w-full h-full object-cover">
                            <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                <i class="fa-solid ${isCurrent && isPlaying ? 'fa-pause' : 'fa-play'} text-xl"></i>
                            </div>
                            <div class="absolute top-3 left-3">
                                <span class="status-badge gold-bg text-black">${badge}</span>
                            </div>
                        </div>
                        <div class="p-4">
                            <h3 class="font-black uppercase italic text-[10px] truncate ${isCurrent ? 'gold-text' : ''}">${b.name}</h3>
                            <p class="text-[7px] font-bold uppercase tracking-widest text-zinc-500 truncate mb-3">${b.producer || 'JADDY'}</p>
                            
                            <div class="flex justify-between items-center">
                                <button onclick="openContactModal('${b.id}')" class="text-[8px] font-black uppercase gold-text border border-yellow-500/30 px-3 py-1 rounded-full">
                                    ADQUIRIR
                                </button>
                                <button onclick="deleteBeat('${b.id}')" class="text-white/10 hover:text-red-500 transition-colors">
                                    <i class="fa-solid fa-trash-can text-[10px]"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.openContactModal = (id) => {
            const beatsRef = collection(db, 'artifacts', appId, 'public', 'data', 'beats');
            onSnapshot(beatsRef, (snap) => {
                snap.forEach(d => {
                    if(d.id === id) {
                        const b = d.data();
                        document.getElementById('modal-beat-name').innerText = b.name;
                        document.getElementById('modal-beat-price').innerText = b.category === 'venta' ? `PRECIO: $${b.price} USD` : b.category.toUpperCase();
                        document.getElementById('modal-payment-info').innerText = b.paymentMethods || "Contactar para detalles.";
                        
                        const waBtn = document.getElementById('modal-whatsapp-btn');
                        if(b.whatsapp) {
                            waBtn.href = `https://wa.me/${b.whatsapp}?text=Hola,%20estoy%20interesado%20en%20el%20beat:%20${encodeURIComponent(b.name)}`;
                            waBtn.classList.remove('hidden');
                        } else waBtn.classList.add('hidden');

                        const mailBtn = document.getElementById('modal-email-btn');
                        if(b.email) {
                            mailBtn.href = `mailto:${b.email}?subject=Interés en Beat: ${b.name}`;
                            mailBtn.classList.remove('hidden');
                        } else mailBtn.classList.add('hidden');

                        document.getElementById('contact-modal').style.display = 'flex';
                    }
                });
            });
        };

        window.closeModal = () => document.getElementById('contact-modal').style.display = 'none';

        // FILE PREVIEWS
        document.getElementById('beat-image-input').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                selectedImageData = ev.target.result;
                document.getElementById('image-preview').innerHTML = `<img src="${selectedImageData}" class="w-full h-full object-cover">`;
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        document.getElementById('beat-audio-input').onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                selectedAudioData = ev.target.result;
                document.getElementById('audio-label').innerHTML = `<i class="fa-solid fa-check text-yellow-500"></i> LISTO`;
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        // UPLOAD
        document.getElementById('btn-upload').onclick = async () => {
            const name = document.getElementById('beat-name-input').value;
            const producer = document.getElementById('producer-name-input').value;
            const category = document.getElementById('beat-category-input').value;
            const price = document.getElementById('beat-price-input').value;
            const whatsapp = document.getElementById('whatsapp-input').value;
            const email = document.getElementById('email-input').value;
            const paymentMethods = document.getElementById('payment-methods-input').value;

            if(!name || !selectedAudioData) return alert("Nombre y Audio son obligatorios");

            document.getElementById('upload-status').classList.remove('hidden');
            
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'beats'), {
                    name, producer, category, price, whatsapp, email, paymentMethods,
                    image: selectedImageData || 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?q=80&w=2070&auto=format&fit=crop',
                    audio: selectedAudioData,
                    createdAt: Date.now()
                });
                location.reload();
            } catch(e) { 
                alert("Error al subir");
                document.getElementById('upload-status').classList.add('hidden');
            }
        };

        // PLAYER LOGIC
        window.handlePlay = (id) => {
            const beatsRef = collection(db, 'artifacts', appId, 'public', 'data', 'beats');
            onSnapshot(beatsRef, (snap) => {
                snap.forEach(d => {
                    if(d.id === id) {
                        if(currentPlayingId === id) {
                            if(audioEngine.paused) { audioEngine.play(); isPlaying = true; }
                            else { audioEngine.pause(); isPlaying = false; }
                        } else {
                            currentPlayingId = id;
                            audioEngine.src = d.data().audio;
                            audioEngine.play();
                            isPlaying = true;
                            document.getElementById('player-img').src = d.data().image;
                            document.getElementById('player-name').innerText = d.data().name;
                            document.getElementById('player-producer').innerText = d.data().producer;
                            document.getElementById('mini-player').classList.remove('translate-y-full');
                        }
                        document.getElementById('btn-play-pause').innerHTML = `<i class="fa-solid fa-${isPlaying ? 'pause' : 'play'}"></i>`;
                    }
                });
            });
        };

        audioEngine.ontimeupdate = () => {
            document.getElementById('progress-bar').style.width = `${(audioEngine.currentTime/audioEngine.duration)*100}%`;
        };

        window.deleteBeat = async (id) => {
            if(confirm("¿Eliminar pista definitivamente?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'beats', id));
            }
        };

        document.getElementById('btn-play-pause').onclick = () => {
            if(audioEngine.paused) { audioEngine.play(); isPlaying = true; }
            else { audioEngine.pause(); isPlaying = false; }
            document.getElementById('btn-play-pause').innerHTML = `<i class="fa-solid fa-${isPlaying ? 'pause' : 'play'}"></i>`;
        };
    </script>
</body>
</html>
