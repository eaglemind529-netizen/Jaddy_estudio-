```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaddy Records - Panel de Carga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-card {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .gold-gradient {
            background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
        }

        .nav-active {
            color: #facc15;
            transform: scale(1.1);
        }

        /* Ocultar scrollbar */
        ::-webkit-scrollbar { display: none; }

        .btn-active:active {
            transform: scale(0.95);
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="p-6 sticky top-0 z-50 glass-card border-b border-white/5 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 gold-gradient rounded-2xl flex items-center justify-center rotate-3 shadow-lg shadow-yellow-500/20">
                <i class="fa-solid fa-shield-halved text-black text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-black italic uppercase tracking-tighter leading-none">Jaddy Records</h1>
                <p class="text-[9px] text-yellow-500 font-bold uppercase tracking-widest mt-1">Admin Dashboard</p>
            </div>
        </div>
    </header>

    <main id="app-content" class="p-4 max-w-xl mx-auto space-y-6">
        <!-- El contenido se inyecta por JS -->
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 glass-card border-t border-white/5 px-8 py-4 flex justify-between items-center z-50">
        <button onclick="router('home')" id="nav-home" class="flex flex-col items-center gap-1 text-zinc-500 transition-all">
            <i class="fa-solid fa-chart-pie text-xl"></i>
            <span class="text-[9px] font-black uppercase tracking-tighter">Negocio</span>
        </button>
        <button onclick="router('catalog')" id="nav-catalog" class="flex flex-col items-center gap-1 text-zinc-500 transition-all">
            <i class="fa-solid fa-music text-xl"></i>
            <span class="text-[9px] font-black uppercase tracking-tighter">Catálogo</span>
        </button>
        <button onclick="router('upload')" id="nav-upload" class="flex flex-col items-center gap-1 text-zinc-500 transition-all">
            <i class="fa-solid fa-circle-plus text-2xl text-yellow-500"></i>
            <span class="text-[9px] font-black uppercase tracking-tighter text-yellow-500">Subir</span>
        </button>
        <button onclick="router('artists')" id="nav-artists" class="flex flex-col items-center gap-1 text-zinc-500 transition-all">
            <i class="fa-solid fa-users text-xl"></i>
            <span class="text-[9px] font-black uppercase tracking-tighter">Artistas</span>
        </button>
    </nav>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // CONFIGURACIÓN
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'jaddy-studio-pro';

        let currentUser = null;
        let tracks = [];
        let artists = [];

        // Estado del formulario
        let formData = {
            name: '',
            imageData: null,
            audioData: null,
            isExclusive: false,
            contract: 'Este contrato otorga el derecho de uso para producciones musicales bajo el sello Jaddy Records...'
        };

        // --- CORE FUNCTIONS ---

        async function init() {
            await signInAnonymously(auth);
            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if(user) {
                    listenData();
                    router('home');
                }
            });
        }

        function listenData() {
            const tracksRef = collection(db, 'artifacts', appId, 'public', 'data', 'pistas');
            onSnapshot(query(tracksRef), (snapshot) => {
                tracks = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                if(window.currentView === 'catalog' || window.currentView === 'home') render();
            });

            const artistsRef = collection(db, 'artifacts', appId, 'public', 'data', 'artistas');
            onSnapshot(query(artistsRef), (snapshot) => {
                artists = snapshot.docs.map(d => ({id: d.id, ...d.data()}));
                if(window.currentView === 'artists') render();
            });
        }

        window.router = (view) => {
            window.currentView = view;
            updateNav();
            render();
        };

        function updateNav() {
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('nav-active', 'text-yellow-500'));
            const activeNav = document.getElementById(`nav-${window.currentView}`);
            if(activeNav) activeNav.classList.add('nav-active', 'text-yellow-500');
        }

        // --- RENDER ENGINE ---

        function render() {
            const container = document.getElementById('app-content');
            container.innerHTML = '';

            if(window.currentView === 'home') {
                container.innerHTML = `
                    <div class="animate-in fade-in duration-500 space-y-6">
                        <div class="gold-gradient rounded-[2.5rem] p-8 text-black relative overflow-hidden shadow-2xl">
                            <div class="relative z-10">
                                <h3 class="font-black italic text-3xl mb-1 leading-none uppercase tracking-tighter">Panel Maestro</h3>
                                <p class="text-[10px] font-bold uppercase mb-6 opacity-70">Control total de Jaddy Records</p>
                                <button onclick="router('upload')" class="bg-black text-white px-8 py-4 rounded-2xl text-[11px] font-black uppercase flex items-center gap-2 shadow-lg active:scale-95 transition-all">
                                    <i class="fa-solid fa-upload"></i> NUEVA PISTA
                                </button>
                            </div>
                            <i class="fa-solid fa-music absolute -bottom-10 -right-10 text-black/10 text-[160px] -rotate-12"></i>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-zinc-900/40 p-5 rounded-[2rem] border border-white/5">
                                <i class="fa-solid fa-users text-yellow-500 mb-2"></i>
                                <p class="text-zinc-500 text-[10px] font-bold uppercase">Artistas</p>
                                <h2 class="text-2xl font-black text-white mt-1">${artists.length}</h2>
                            </div>
                            <div class="bg-zinc-900/40 p-5 rounded-[2rem] border border-white/5">
                                <i class="fa-solid fa-compact-disc text-yellow-500 mb-2"></i>
                                <p class="text-zinc-500 text-[10px] font-bold uppercase">Beats</p>
                                <h2 class="text-2xl font-black text-white mt-1">${tracks.length}</h2>
                            </div>
                        </div>
                    </div>
                `;
            }

            if(window.currentView === 'upload') {
                container.innerHTML = `
                    <div class="animate-in slide-in-from-bottom-4 duration-300 space-y-6">
                        <div class="flex items-center justify-between">
                            <h2 class="text-xl font-black uppercase italic tracking-tighter">Subir Nuevo Material</h2>
                            <button onclick="router('home')" class="text-zinc-500"><i class="fa-solid fa-xmark text-xl"></i></button>
                        </div>

                        <div class="bg-zinc-900/80 p-6 rounded-[3rem] border border-white/10 space-y-6 shadow-2xl">
                            <div class="flex flex-col items-center gap-4">
                                <label class="w-32 h-32 bg-black border-2 border-dashed border-zinc-800 rounded-3xl flex flex-col items-center justify-center cursor-pointer overflow-hidden group relative">
                                    <input type="file" accept="image/*" onchange="handleFile(this, 'imageData')">
                                    ${formData.imageData ? `<img src="${formData.imageData}" class="w-full h-full object-cover">` : `
                                        <i class="fa-solid fa-image text-3xl text-zinc-700 group-hover:text-yellow-500"></i>
                                        <span class="text-[9px] font-black text-zinc-600 mt-2 uppercase">Portada</span>
                                    `}
                                </label>
                                <div class="w-full">
                                    <label class="text-[10px] font-black text-zinc-500 uppercase ml-1 block mb-1">Nombre del Beat</label>
                                    <input type="text" id="trackName" value="${formData.name}" oninput="formData.name = this.value" placeholder="Escribe el título..." 
                                        class="w-full bg-black border border-zinc-800 p-5 rounded-2xl text-sm font-bold focus:border-yellow-500 outline-none transition-all">
                                </div>
                            </div>

                            <label class="block w-full text-center p-8 border-2 border-dashed rounded-3xl cursor-pointer transition-all ${formData.audioData ? 'border-green-500 bg-green-500/5' : 'border-yellow-500/30 bg-yellow-500/5 hover:border-yellow-500'}">
                                <input type="file" accept="audio/*" onchange="handleFile(this, 'audioData')">
                                ${formData.audioData ? `
                                    <div class="text-green-500 flex flex-col items-center gap-2">
                                        <i class="fa-solid fa-check-circle text-2xl"></i>
                                        <span class="text-xs font-black uppercase">Archivo de audio listo</span>
                                    </div>
                                ` : `
                                    <div class="flex flex-col items-center gap-2">
                                        <i class="fa-solid fa-cloud-arrow-up text-2xl text-yellow-500"></i>
                                        <span class="text-xs font-black uppercase text-white">Cargar MP3 / WAV</span>
                                        <span class="text-[9px] text-zinc-500 font-bold uppercase tracking-widest">Toca para seleccionar archivo</span>
                                    </div>
                                `}
                            </label>

                            <div class="bg-black/50 p-6 rounded-3xl border border-zinc-800 flex items-center justify-between">
                                <div class="pr-4">
                                    <span class="text-[10px] font-black uppercase text-white tracking-tighter">Exclusivo Artistas</span>
                                    <p class="text-[9px] text-zinc-500 font-bold leading-tight uppercase mt-1">Si activas esto, no se mostrará para venta pública.</p>
                                </div>
                                <button onclick="toggleExcl()" class="w-14 h-7 rounded-full transition-all relative ${formData.isExclusive ? 'bg-yellow-500' : 'bg-zinc-800'}">
                                    <div class="absolute top-1 w-5 h-5 rounded-full bg-white transition-all ${formData.isExclusive ? 'left-8' : 'left-1'}"></div>
                                </button>
                            </div>

                            <div class="space-y-3">
                                <label class="text-[10px] font-black uppercase text-zinc-500 ml-1">Contrato de Licencia</label>
                                <textarea oninput="formData.contract = this.value" class="w-full bg-black border border-zinc-800 p-5 rounded-2xl text-[11px] font-medium h-32 text-zinc-300 focus:border-yellow-500 outline-none leading-relaxed resize-none">${formData.contract}</textarea>
                            </div>

                            <button id="uploadBtn" onclick="saveTrack()" class="w-full bg-yellow-500 text-black py-5 rounded-2xl font-black uppercase text-sm shadow-xl active:scale-95 transition-all">
                                PUBLICAR EN EL SELLO
                            </button>
                        </div>
                    </div>
                `;
            }

            if(window.currentView === 'catalog') {
                container.innerHTML = `
                    <div class="animate-in fade-in duration-500 space-y-6">
                        <div class="flex justify-between items-center px-2">
                            <h2 class="text-xl font-black uppercase italic tracking-tighter">Catálogo Musical</h2>
                            <button onclick="router('upload')" class="bg-zinc-900 p-3 rounded-2xl text-yellow-500 border border-white/5"><i class="fa-solid fa-plus"></i></button>
                        </div>
                        <div class="space-y-4">
                            ${tracks.length === 0 ? '<p class="text-center text-zinc-600 font-black uppercase text-[10px] py-20">Nada cargado todavía</p>' : tracks.map(t => `
                                <div class="bg-zinc-900/40 rounded-[2.5rem] p-4 border border-white/5 flex items-center gap-4">
                                    <img src="${t.imageData || 'https://via.placeholder.com/100'}" class="w-16 h-16 rounded-2xl object-cover">
                                    <div class="flex-1">
                                        <h4 class="font-black text-sm uppercase tracking-tighter">${t.name}</h4>
                                        <span class="text-[9px] font-black uppercase ${t.isExclusive ? 'text-yellow-500' : 'text-zinc-500'}">${t.isExclusive ? 'EXCLUSIVA ARTISTA' : 'PÚBLICO'}</span>
                                    </div>
                                    <button onclick="deleteTrack('${t.id}')" class="p-3 text-red-500"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            if(window.currentView === 'artists') {
                container.innerHTML = `
                    <div class="animate-in fade-in duration-500 space-y-6">
                        <h2 class="text-xl font-black uppercase italic tracking-tighter">Artistas Firmados</h2>
                        <div class="bg-zinc-900/50 p-6 rounded-[3rem] border border-white/5 space-y-4">
                            <input id="artName" type="text" placeholder="Nombre Artístico" class="w-full bg-black border border-zinc-800 p-4 rounded-2xl text-sm font-bold outline-none">
                            <button onclick="addArtist()" class="w-full bg-white text-black py-4 rounded-2xl font-black uppercase text-[11px]">Firmar Artista</button>
                        </div>
                        <div class="grid grid-cols-1 gap-2">
                            ${artists.map(a => `
                                <div class="bg-zinc-900/20 p-5 rounded-2xl flex justify-between items-center border border-white/5">
                                    <div class="flex items-center gap-3">
                                        <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                                        <span class="font-black uppercase text-xs">${a.name}</span>
                                    </div>
                                    <button onclick="deleteArtist('${a.id}')" class="text-zinc-600"><i class="fa-solid fa-xmark"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }

        // --- HANDLERS ---

        window.handleFile = (input, type) => {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                formData[type] = e.target.result;
                render();
            };
            reader.readAsDataURL(file);
        };

        window.toggleExcl = () => {
            formData.isExclusive = !formData.isExclusive;
            render();
        };

        window.saveTrack = async () => {
            if(!formData.audioData || !formData.name) return showMsg('Faltan datos clave');
            const btn = document.getElementById('uploadBtn');
            btn.innerHTML = "Subiendo...";
            btn.disabled = true;

            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'pistas'), {
                    ...formData,
                    createdAt: new Date().toISOString()
                });
                formData = { name: '', imageData: null, audioData: null, isExclusive: false, contract: formData.contract };
                router('catalog');
            } catch (e) {
                console.error(e);
                showMsg('Error al subir');
            }
        };

        window.addArtist = async () => {
            const name = document.getElementById('artName').value;
            if(!name) return;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'artistas'), {
                name,
                joinedAt: new Date().toISOString()
            });
            document.getElementById('artName').value = '';
        };

        window.deleteTrack = async (id) => {
            if(confirm('¿Eliminar esta pista?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'pistas', id));
        };

        window.deleteArtist = async (id) => {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'artistas', id));
        };

        function showMsg(m) {
            const el = document.createElement('div');
            el.className = "fixed top-24 left-1/2 -translate-x-1/2 bg-yellow-500 text-black px-6 py-3 rounded-full font-black text-[10px] uppercase shadow-2xl z-[100] animate-bounce";
            el.innerText = m;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        init();
    </script>
</body>
</html>

```
