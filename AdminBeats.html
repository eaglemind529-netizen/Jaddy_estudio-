```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaddy Studio | Control de Beats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg { background: radial-gradient(circle at top, #1e293b 0%, #020617 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); }
        .neon-border-purple { border: 1px solid rgba(168, 85, 247, 0.2); }
        
        input, select { 
            background: rgba(255, 255, 255, 0.03) !important; 
            border: 1px solid rgba(255, 255, 255, 0.1) !important; 
            color: white !important;
            outline: none;
        }
        input:focus, select:focus { border-color: #a855f7 !important; }
        
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(200%);
            padding: 1rem 2rem;
            border-radius: 1rem;
            background: white;
            color: black;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 10px;
            transition: transform 0.3s ease;
            z-index: 100;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body class="gradient-bg min-h-screen text-white font-sans p-4 md:p-8">

    <div id="custom-toast" class="toast">Acción completada</div>

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-6">
            <div>
                <p class="text-[10px] font-black uppercase tracking-[0.4em] text-purple-500 mb-1">Panel de Control</p>
                <h1 class="text-3xl font-black italic uppercase">Catálogo de <span class="text-purple-500">Pistas</span></h1>
            </div>
            
            <button onclick="toggleModal('add-beat-modal')" class="bg-white text-black font-black py-4 px-8 rounded-2xl text-[10px] uppercase tracking-widest hover:bg-purple-500 transition-all active:scale-95">
                + Añadir Nuevo Beat
            </button>
        </div>

        <!-- Dashboard Stats Simple -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="glass-card p-6 rounded-[2rem] border-white/5">
                <p class="text-[9px] font-black text-gray-500 uppercase mb-1">Total Beats</p>
                <h3 id="stat-total" class="text-2xl font-black">0</h3>
            </div>
            <div class="glass-card p-6 rounded-[2rem] border-white/5">
                <p class="text-[9px] font-black text-gray-500 uppercase mb-1">Regalos (Gratis)</p>
                <h3 id="stat-free" class="text-2xl font-black text-emerald-400">0</h3>
            </div>
            <div class="glass-card p-6 rounded-[2rem] border-white/5">
                <p class="text-[9px] font-black text-gray-500 uppercase mb-1">En Venta</p>
                <h3 id="stat-paid" class="text-2xl font-black text-purple-400">0</h3>
            </div>
        </div>

        <!-- Table Container -->
        <div class="glass-card rounded-[2.5rem] p-2 md:p-6 neon-border-purple overflow-x-auto">
            <table class="w-full text-left border-separate border-spacing-y-3">
                <thead>
                    <tr class="text-[9px] font-black uppercase tracking-widest text-gray-500">
                        <th class="px-6 pb-2">Tipo</th>
                        <th class="px-6 pb-2">Nombre</th>
                        <th class="px-6 pb-2">Género</th>
                        <th class="px-6 pb-2">Precio/Estado</th>
                        <th class="px-6 pb-2">YouTube</th>
                        <th class="px-6 pb-2 text-right">Borrar</th>
                    </tr>
                </thead>
                <tbody id="beats-table-body">
                    <!-- Filas dinámicas -->
                </tbody>
            </table>
            
            <div id="loading-state" class="py-20 text-center">
                <div class="inline-block w-6 h-6 border-2 border-purple-500/20 border-t-purple-500 rounded-full animate-spin"></div>
            </div>
        </div>
    </div>

    <!-- MODAL: AGREGAR BEAT -->
    <div id="add-beat-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden flex items-center justify-center z-50 p-4">
        <div class="w-full max-w-lg glass-card p-8 rounded-[2.5rem] border-white/10 relative">
            <button onclick="toggleModal('add-beat-modal')" class="absolute top-6 right-8 text-gray-500 hover:text-white text-xl">&times;</button>
            
            <h2 class="text-lg font-black uppercase italic mb-6">Subir <span class="text-purple-500">Nuevo Beat</span></h2>
            
            <form id="beat-form" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[9px] font-black text-gray-500 ml-4 uppercase">Tipo de Oferta</label>
                        <select id="beat-type" class="w-full p-4 rounded-xl text-[11px] font-bold appearance-none">
                            <option value="paid">De Pago ($)</option>
                            <option value="free">Regalo (Gratis)</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[9px] font-black text-gray-500 ml-4 uppercase">Precio ($ USD)</label>
                        <input type="number" id="beat-price" placeholder="0.00" class="w-full p-4 rounded-xl text-[11px] font-bold">
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-[9px] font-black text-gray-500 ml-4 uppercase">Nombre del Beat</label>
                    <input type="text" id="beat-name" placeholder="Ej: Dragon Fury" required class="w-full p-4 rounded-xl text-[11px] font-bold">
                </div>

                <div class="space-y-1">
                    <label class="text-[9px] font-black text-gray-500 ml-4 uppercase">Género Musical</label>
                    <input type="text" id="beat-genre" placeholder="Dancehall, Afrobeat..." required class="w-full p-4 rounded-xl text-[11px] font-bold">
                </div>

                <div class="space-y-1">
                    <label class="text-[9px] font-black text-gray-500 ml-4 uppercase">Enlace de YouTube</label>
                    <input type="url" id="beat-link" placeholder="https://youtube.com/..." required class="w-full p-4 rounded-xl text-[11px] font-bold">
                </div>

                <button type="submit" class="w-full py-4 bg-purple-600 text-white font-black rounded-xl uppercase text-[10px] mt-4 hover:bg-purple-500 transition-colors">
                    Guardar en Catálogo
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDIaAvpJZrJjQUKsh6KGD7gALJNskto8A8",
            authDomain: "jaddy-estudio.firebaseapp.com",
            projectId: "jaddy-estudio",
            storageBucket: "jaddy-estudio.firebasestorage.app",
            messagingSenderId: "968903268866",
            appId: "1:968903268866:web:e2b6895e8acff18178e51b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const appId = "jaddy-studio-beats";

        window.toggleModal = (id) => document.getElementById(id).classList.toggle('hidden');
        
        function showToast(msg) {
            const toast = document.getElementById('custom-toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        const beatsCol = collection(db, 'artifacts', appId, 'public', 'data', 'beats');
        
        onSnapshot(beatsCol, (snapshot) => {
            const tableBody = document.getElementById('beats-table-body');
            document.getElementById('loading-state').classList.add('hidden');
            tableBody.innerHTML = "";

            let total = 0, free = 0, paid = 0;

            snapshot.forEach((docSnap) => {
                const beat = docSnap.data();
                const id = docSnap.id;
                total++;
                if(beat.type === 'free') free++; else paid++;

                const isFree = beat.type === 'free';

                const row = `
                    <tr class="bg-white/5 hover:bg-white/10 transition-all group">
                        <td class="px-6 py-4 rounded-l-2xl">
                            <span class="text-[8px] font-black uppercase px-2 py-1 rounded ${isFree ? 'bg-emerald-500/20 text-emerald-400' : 'bg-purple-500/20 text-purple-400'}">
                                ${isFree ? 'Regalo' : 'Venta'}
                            </span>
                        </td>
                        <td class="px-6 py-4 font-black uppercase text-[10px] tracking-wider">${beat.name}</td>
                        <td class="px-6 py-4 text-gray-400 text-[10px]">${beat.genre}</td>
                        <td class="px-6 py-4">
                            <span class="font-mono text-[11px] ${isFree ? 'text-emerald-400' : 'text-white'}">
                                ${isFree ? 'GRATIS' : '$' + beat.price}
                            </span>
                        </td>
                        <td class="px-6 py-4">
                            <a href="${beat.link}" target="_blank" class="text-red-500 hover:scale-110 inline-block transition-transform">
                                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
                            </a>
                        </td>
                        <td class="px-6 py-4 text-right rounded-r-2xl">
                            <button onclick="deleteBeat('${id}')" class="text-gray-600 hover:text-red-500 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2"/></svg>
                            </button>
                        </td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-free').innerText = free;
            document.getElementById('stat-paid').innerText = paid;

            if (snapshot.empty) {
                tableBody.innerHTML = `<tr><td colspan="6" class="py-20 text-center text-[10px] font-black text-gray-600 uppercase tracking-widest">Catálogo vacío</td></tr>`;
            }
        });

        // Toggle price based on type
        document.getElementById('beat-type').addEventListener('change', (e) => {
            const priceInput = document.getElementById('beat-price');
            if (e.target.value === 'free') {
                priceInput.value = "0";
                priceInput.disabled = true;
                priceInput.classList.add('opacity-30');
            } else {
                priceInput.disabled = false;
                priceInput.classList.remove('opacity-30');
            }
        });

        document.getElementById('beat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.disabled = true;

            try {
                await addDoc(beatsCol, {
                    type: document.getElementById('beat-type').value,
                    name: document.getElementById('beat-name').value,
                    genre: document.getElementById('beat-genre').value,
                    price: document.getElementById('beat-type').value === 'free' ? 0 : parseFloat(document.getElementById('beat-price').value),
                    link: document.getElementById('beat-link').value,
                    createdAt: new Date().toISOString()
                });
                showToast("Beat guardado con éxito");
                e.target.reset();
                document.getElementById('beat-price').disabled = false;
                document.getElementById('beat-price').classList.remove('opacity-30');
                toggleModal('add-beat-modal');
            } catch (err) {
                showToast("Error al guardar");
            } finally {
                btn.disabled = false;
            }
        });

        window.deleteBeat = async (id) => {
            if (confirm("¿Eliminar este beat del catálogo?")) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'beats', id));
                    showToast("Beat eliminado");
                } catch (err) {
                    showToast("Error al eliminar");
                }
            }
        };
    </script>
</body>
</html>

```
