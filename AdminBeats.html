```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;

            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);

        .neo-input:focus {
            border-color: #a855f7;

</head>
<body class="min-h-screen p-4 md:p-8">

    <!-- Notificaciones -->
    <div id="status-toast" class="fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300">
        <div class="glass px-6 py-3 rounded-full border-l-4 border-purple-500 shadow-2xl">
            <p id="status-text" class="text-xs font-bold uppercase tracking-widest text-white">Sincronizando...</p>
        </div>
    </div>

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-12 gap-4">
            <div>
                <h1 class="text-4xl font-black italic tracking-tighter uppercase">JADDY <span class="text-purple-500 underline">STUDIO</span></h1>
                <div class="flex items-center gap-2 mt-2">
                    <span id="db-indicator" class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
                    <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Base de Datos: <span id="db-status">Desconectado</span></p>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="location.reload()" class="glass p-3 rounded-xl hover:bg-white/10 transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </button>
                <div class="accent-gradient px-6 py-3 rounded-xl font-black text-[10px] uppercase tracking-tighter">Panel Maestro</div>
            </div>
        </header>

        <div class="grid lg:grid-cols-3 gap-8">
            
            <!-- Columna Izquierda: Pagos -->
            <div class="lg:col-span-2 space-y-8">
                <section class="glass p-8 rounded-3xl">
                    <h2 class="text-xl font-black uppercase mb-6 flex items-center gap-2">
                        <span class="w-8 h-8 accent-gradient rounded-lg flex items-center justify-center text-xs">01</span>
                        Configuración de Pagos
                    </h2>
                    
                    <form id="payment-form" class="grid md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-gray-500 uppercase ml-1">Pago Móvil (Detalles)</label>
                            <textarea id="pago_movil" class="neo-input w-full p-4 rounded-2xl text-sm min-h-[100px]" placeholder="Banco, C.I., Teléfono..."></textarea>
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-gray-500 uppercase ml-1">Binance (ID / Email)</label>
                            <input id="binance" type="text" class="neo-input w-full p-4 rounded-2xl text-sm" placeholder="ID de Usuario o Correo">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-gray-500 uppercase ml-1">Cuenta Contigo</label>
                            <input id="contigo" type="text" class="neo-input w-full p-4 rounded-2xl text-sm" placeholder="Nro de Cuenta">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-bold text-gray-500 uppercase ml-1">Otros / Zelle</label>
                            <input id="otros" type="text" class="neo-input w-full p-4 rounded-2xl text-sm" placeholder="Correo o contacto">
                        </div>
                        <div class="md:col-span-2 pt-4">
                            <button type="submit" class="w-full accent-gradient py-4 rounded-2xl font-black uppercase text-xs tracking-widest hover:opacity-90 transition-all shadow-lg shadow-purple-500/20">
                                Guardar Cambios en la Nube
                            </button>
                        </div>
                    </form>
                </section>

                <section class="glass p-8 rounded-3xl">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-black uppercase flex items-center gap-2">
                            <span class="w-8 h-8 accent-gradient rounded-lg flex items-center justify-center text-xs">02</span>
                            Inventario de Beats
                        </h2>
                        <button onclick="toggleModal(true)" class="bg-white/10 hover:bg-white/20 p-2 rounded-lg transition-all">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="2" stroke-linecap="round"></path></svg>
                        </button>
                    </div>

                    <div id="beats-container" class="grid gap-4">
                        <!-- Cargando... -->
                        <div class="animate-pulse bg-white/5 h-16 rounded-2xl"></div>
                        <div class="animate-pulse bg-white/5 h-16 rounded-2xl"></div>
                    </div>
                </section>
            </div>

            <!-- Columna Derecha: Estadísticas / Info -->
            <div class="space-y-6">
                <div class="glass p-6 rounded-3xl">
                    <p class="text-[10px] font-bold text-gray-500 uppercase mb-1">Total Beats</p>
                    <h3 id="stat-total" class="text-4xl font-black">0</h3>
                </div>
                <div class="glass p-6 rounded-3xl border-l-4 border-purple-500">
                    <p class="text-[10px] font-bold text-gray-500 uppercase mb-1">Última Actividad</p>
                    <p id="last-update" class="text-xs font-mono text-gray-400">Sin registros</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Nuevo Beat -->
    <div id="beat-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden z-50 items-center justify-center p-4">
        <div class="glass w-full max-w-lg p-8 rounded-[40px] relative">
            <button onclick="toggleModal(false)" class="absolute top-6 right-8 text-2xl text-gray-500 hover:text-white">&times;</button>
            <h2 class="text-2xl font-black uppercase italic mb-8">Nueva <span class="text-purple-500">Pista</span></h2>
            
            <form id="beat-form" class="space-y-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-black uppercase text-gray-500 ml-1">Título del Beat</label>
                    <input id="b_name" required type="text" class="neo-input w-full p-4 rounded-2xl font-bold" placeholder="Ej: Fuego Tropical">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-gray-500 ml-1">Tipo</label>
                        <select id="b_type" class="neo-input w-full p-4 rounded-2xl font-bold text-sm">
                            <option value="paid">Premium ($)</option>
                            <option value="free">Gratis</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-black uppercase text-gray-500 ml-1">Precio ($)</label>
                        <input id="b_price" type="number" step="0.01" class="neo-input w-full p-4 rounded-2xl font-bold" placeholder="0.00">
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black uppercase text-gray-500 ml-1">Género</label>
                    <input id="b_genre" required type="text" class="neo-input w-full p-4 rounded-2xl font-bold" placeholder="Trap, Reggaeton, Drill...">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-black uppercase text-gray-500 ml-1">Link de YouTube / Audio</label>
                    <input id="b_link" required type="url" class="neo-input w-full p-4 rounded-2xl font-bold" placeholder="https://youtube.com/watch?v=...">
                </div>
                <button type="submit" class="w-full accent-gradient py-4 rounded-2xl font-black uppercase text-xs tracking-widest mt-4">
                    Publicar Beat
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, onSnapshot, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        // Configuración recibida
        const firebaseConfig = {
            apiKey: "AIzaSyDIaAvpJZrJjQUKsh6KGD7gALJNskto8A8",
            authDomain: "jaddy-estudio.firebaseapp.com",
            projectId: "jaddy-estudio",
            storageBucket: "jaddy-estudio.firebasestorage.app",
            messagingSenderId: "968903268866",
            appId: "1:968903268866:web:e2b6895e8acff18178e51b"
        };

        const APP_ID = "jaddy_studio_v1";

        // Inicialización
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // UI Functions
        window.toggleModal = (show) => {
            document.getElementById('beat-modal').style.display = show ? 'flex' : 'none';
        }

        const notify = (msg) => {
            const toast = document.getElementById('status-toast');
            document.getElementById('status-text').innerText = msg;
            toast.style.transform = 'translateX(0)';
            setTimeout(() => toast.style.transform = 'translateX(120%)', 3000);
        }

        // --- CEREBRO: FLUJO DE DATOS ---
        
        // 1. Conectar
        const connect = async () => {
            try {
                await signInAnonymously(auth);
                document.getElementById('db-indicator').classList.replace('bg-red-500', 'bg-green-500');
                document.getElementById('db-status').innerText = "Sincronizado";
                
                loadPayments();
                listenBeats();
            } catch (e) {
                console.error(e);
                document.getElementById('db-status').innerText = "Error de Conexión";
            }
        }

        // 2. Gestionar Pagos
        const loadPayments = async () => {
            const ref = doc(db, 'artifacts', APP_ID, 'public', 'data', 'payments');
            const snap = await getDoc(ref);
            if(snap.exists()) {
                const d = snap.data();
                document.getElementById('pago_movil').value = d.pago_movil || "";
                document.getElementById('binance').value = d.binance || "";
                document.getElementById('contigo').value = d.contigo || "";
                document.getElementById('otros').value = d.otros || "";
                if(d.updated_at) document.getElementById('last-update').innerText = new Date(d.updated_at).toLocaleString();
            }
        }

        document.getElementById('payment-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const ref = doc(db, 'artifacts', APP_ID, 'public', 'data', 'payments');
            const data = {
                pago_movil: document.getElementById('pago_movil').value,
                binance: document.getElementById('binance').value,
                contigo: document.getElementById('contigo').value,
                otros: document.getElementById('otros').value,
                updated_at: new Date().toISOString()
            };
            
            try {
                await setDoc(ref, data);
                notify("Pagos Actualizados");
                document.getElementById('last-update').innerText = new Date().toLocaleString();
            } catch (err) { notify("Error al Guardar"); }
        });

        // 3. Gestionar Beats
        const listenBeats = () => {
            const ref = collection(db, 'artifacts', APP_ID, 'public', 'data', 'beats');
            onSnapshot(ref, (snap) => {
                const container = document.getElementById('beats-container');
                container.innerHTML = "";
                document.getElementById('stat-total').innerText = snap.size;

                if(snap.empty) {
                    container.innerHTML = `<p class="text-center py-8 text-gray-600 font-bold uppercase text-[10px] tracking-widest italic">No hay beats registrados</p>`;
                    return;
                }

                snap.forEach(docSnap => {
                    const beat = docSnap.data();
                    const id = docSnap.id;
                    const row = document.createElement('div');
                    row.className = "glass p-4 rounded-2xl flex items-center justify-between group hover:border-purple-500/30 transition-all";
                    row.innerHTML = `
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 rounded-xl bg-white/5 flex items-center justify-center text-[10px] font-black ${beat.type === 'free' ? 'text-green-500' : 'text-purple-500'}">
                                ${beat.type === 'free' ? 'FREE' : '$' + beat.price}
                            </div>
                            <div>
                                <h4 class="font-black uppercase text-sm">${beat.name}</h4>
                                <p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest">${beat.genre}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <a href="${beat.link}" target="_blank" class="p-2 text-gray-500 hover:text-white transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" stroke-width="2" stroke-linecap="round"></path></svg>
                            </a>
                            <button onclick="window.removeBeat('${id}')" class="p-2 text-gray-700 hover:text-red-500 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2" stroke-linecap="round"></path></svg>
                            </button>
                        </div>
                    `;
                    container.appendChild(row);
                });
            });
        }

        window.removeBeat = async (id) => {
            if(confirm("¿Seguro que quieres borrar este beat de la nube?")) {
                await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'beats', id));
                notify("Beat Eliminado");
            }
        }

        document.getElementById('beat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const ref = collection(db, 'artifacts', APP_ID, 'public', 'data', 'beats');
            const newBeat = {
                name: document.getElementById('b_name').value,
                type: document.getElementById('b_type').value,
                price: document.getElementById('b_price').value || 0,
                genre: document.getElementById('b_genre').value,
                link: document.getElementById('b_link').value,
                timestamp: new Date().getTime()
            };

            try {
                await addDoc(ref, newBeat);
                notify("Beat Publicado con Éxito");
                e.target.reset();
                toggleModal(false);
            } catch (err) { notify("Error al publicar"); }
        });

        // Iniciar el cerebro
        connect();
    </script>
</body>
</html>
