```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jaddy Records - Panel Maestro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #ffffff;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(20, 20, 20, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .gold-gradient {
            background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
        }

        .nav-btn {
            transition: all 0.3s ease;
        }

        .nav-active {
            color: #facc15 !important;
            transform: translateY(-4px);
        }

        .upload-zone {
            border: 2px dashed rgba(250, 204, 21, 0.3);
            transition: all 0.3s ease;
        }

        .upload-zone:active {
            border-color: #facc15;
            background: rgba(250, 204, 21, 0.05);
        }

        input[type="file"] { display: none; }
        
        /* Animaciones */
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="pb-28">

    <!-- Header Fijo -->
    <header class="p-6 sticky top-0 z-50 glass-card border-b border-white/5 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 gold-gradient rounded-xl flex items-center justify-center rotate-3 shadow-lg">
                <i class="fa-solid fa-bolt text-black text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-black italic uppercase tracking-tighter leading-none">Jaddy Records</h1>
                <p class="text-[9px] text-yellow-500 font-bold uppercase tracking-widest mt-1 underline decoration-2">Admin Pro</p>
            </div>
        </div>
        <div class="flex gap-2">
            <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
            <span class="text-[10px] font-bold text-zinc-500 uppercase">En Línea</span>
        </div>
    </header>

    <!-- Contenedor Principal Dinámico -->
    <main id="app-content" class="p-4 max-w-xl mx-auto min-h-[70vh]">
        <!-- Aquí se cargará el contenido mediante JS -->
    </main>

    <!-- Barra de Navegación Inferior -->
    <nav class="fixed bottom-0 left-0 right-0 glass-card border-t border-white/10 px-6 py-4 flex justify-between items-end z-50">
        <button onclick="router('home')" id="nav-home" class="nav-btn flex flex-col items-center gap-1 text-zinc-600 flex-1">
            <i class="fa-solid fa-house-chimney text-xl"></i>
            <span class="text-[8px] font-black uppercase">Inicio</span>
        </button>
        
        <button onclick="router('catalog')" id="nav-catalog" class="nav-btn flex flex-col items-center gap-1 text-zinc-600 flex-1">
            <i class="fa-solid fa-compact-disc text-xl"></i>
            <span class="text-[8px] font-black uppercase">Catálogo</span>
        </button>

        <button onclick="router('upload')" id="nav-upload" class="flex flex-col items-center gap-1 flex-1 -mt-8">
            <div class="w-14 h-14 gold-gradient rounded-full flex items-center justify-center shadow-xl shadow-yellow-500/20 border-4 border-[#050505] active:scale-90 transition-transform">
                <i class="fa-solid fa-plus text-black text-2xl"></i>
            </div>
            <span class="text-[8px] font-black uppercase text-yellow-500 mt-1">Subir</span>
        </button>

        <button onclick="router('artists')" id="nav-artists" class="nav-btn flex flex-col items-center gap-1 text-zinc-600 flex-1">
            <i class="fa-solid fa-user-group text-xl"></i>
            <span class="text-[8px] font-black uppercase">Artistas</span>
        </button>

        <button onclick="router('settings')" id="nav-settings" class="nav-btn flex flex-col items-center gap-1 text-zinc-600 flex-1">
            <i class="fa-solid fa-gear text-xl"></i>
            <span class="text-[8px] font-black uppercase">Ajustes</span>
        </button>
    </nav>

    <script>
        // --- ESTADO DE LA APP ---
        let currentView = 'home';
        let tracks = JSON.parse(localStorage.getItem('jaddy_tracks')) || [];
        let artists = JSON.parse(localStorage.getItem('jaddy_artists')) || [];
        
        let uploadForm = {
            name: '',
            image: null,
            audioName: '',
            isExclusive: false
        };

        // --- NAVEGACIÓN ---
        function router(view) {
            currentView = view;
            
            // Actualizar UI de botones
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('nav-active'));
            const activeBtn = document.getElementById(`nav-${view}`);
            if(activeBtn) activeBtn.classList.add('nav-active');

            render();
            window.scrollTo(0,0);
        }

        // --- RENDERIZADO ---
        function render() {
            const container = document.getElementById('app-content');
            
            if (currentView === 'home') {
                container.innerHTML = `
                    <div class="fade-in space-y-6">
                        <div class="gold-gradient rounded-[2.5rem] p-8 text-black relative overflow-hidden">
                            <h3 class="font-black italic text-3xl uppercase tracking-tighter leading-none mb-2">Bienvenido, Jefe</h3>
                            <p class="text-[10px] font-bold uppercase opacity-80">Estado actual de la disquera</p>
                            <div class="mt-8 flex gap-4">
                                <div class="bg-black/10 backdrop-blur-md p-4 rounded-2xl flex-1">
                                    <span class="block text-[8px] font-black uppercase">Total Beats</span>
                                    <span class="text-2xl font-black">${tracks.length}</span>
                                </div>
                                <div class="bg-black/10 backdrop-blur-md p-4 rounded-2xl flex-1">
                                    <span class="block text-[8px] font-black uppercase">Artistas</span>
                                    <span class="text-2xl font-black">${artists.length}</span>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-4">
                            <h4 class="text-[11px] font-black uppercase tracking-widest text-zinc-500 px-2">Acciones Rápidas</h4>
                            <div class="grid grid-cols-1 gap-3">
                                <button onclick="router('upload')" class="bg-zinc-900 p-5 rounded-3xl border border-white/5 flex items-center justify-between group">
                                    <div class="flex items-center gap-4">
                                        <div class="w-12 h-12 bg-yellow-500/10 rounded-2xl flex items-center justify-center text-yellow-500">
                                            <i class="fa-solid fa-upload"></i>
                                        </div>
                                        <div class="text-left">
                                            <span class="block text-sm font-black uppercase italic tracking-tighter text-white">Subir nueva pista</span>
                                            <span class="text-[9px] text-zinc-500 font-bold uppercase">MP3, WAV o Instrumentales</span>
                                        </div>
                                    </div>
                                    <i class="fa-solid fa-chevron-right text-zinc-700 group-hover:text-yellow-500"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            if (currentView === 'upload') {
                container.innerHTML = `
                    <div class="fade-in space-y-6">
                        <header class="flex justify-between items-center">
                            <h2 class="text-2xl font-black italic uppercase tracking-tighter">Nueva Carga</h2>
                            <button onclick="router('home')" class="w-10 h-10 bg-zinc-900 rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </header>

                        <div class="bg-zinc-900/60 p-6 rounded-[3rem] border border-white/5 space-y-6">
                            <div class="flex justify-center">
                                <label class="w-40 h-40 bg-black rounded-[2.5rem] border-2 border-dashed border-zinc-800 flex flex-col items-center justify-center overflow-hidden cursor-pointer">
                                    <input type="file" accept="image/*" onchange="processFile(this, 'image')">
                                    ${uploadForm.image ? `<img src="${uploadForm.image}" class="w-full h-full object-cover">` : `
                                        <i class="fa-solid fa-camera text-2xl text-zinc-700 mb-2"></i>
                                        <span class="text-[9px] font-black uppercase text-zinc-500">Foto Portada</span>
                                    `}
                                </label>
                            </div>

                            <div class="space-y-1">
                                <label class="text-[10px] font-black uppercase text-zinc-500 ml-4">Nombre del Beat / Track</label>
                                <input type="text" id="t-name" value="${uploadForm.name}" oninput="uploadForm.name = this.value" placeholder="Ej: Trap King 2024" 
                                    class="w-full bg-black border border-zinc-800 p-5 rounded-2xl font-bold focus:border-yellow-500 outline-none">
                            </div>

                            <label class="upload-zone p-10 rounded-[2rem] flex flex-col items-center justify-center gap-3 cursor-pointer">
                                <input type="file" accept="audio/*" onchange="processFile(this, 'audio')">
                                <i class="fa-solid fa-music text-3xl text-yellow-500"></i>
                                <div class="text-center">
                                    <span class="block text-xs font-black uppercase text-white">${uploadForm.audioName || 'Seleccionar Audio'}</span>
                                    <span class="text-[9px] font-bold text-zinc-500 uppercase">Click para buscar archivo</span>
                                </div>
                            </label>

                            <button onclick="saveTrack()" class="w-full gold-gradient text-black py-5 rounded-2xl font-black uppercase text-sm shadow-xl active:scale-95 transition-all">
                                Publicar en Jaddy Records
                            </button>
                        </div>
                    </div>
                `;
            }

            if (currentView === 'catalog') {
                container.innerHTML = `
                    <div class="fade-in space-y-6">
                        <h2 class="text-2xl font-black italic uppercase tracking-tighter">Mi Catálogo</h2>
                        <div class="grid grid-cols-1 gap-4">
                            ${tracks.length === 0 ? `
                                <div class="py-20 text-center space-y-4">
                                    <i class="fa-solid fa-compact-disc text-5xl text-zinc-800 animate-spin-slow"></i>
                                    <p class="text-zinc-600 font-black uppercase text-[10px] tracking-widest">No hay música en el servidor</p>
                                    <button onclick="router('upload')" class="text-yellow-500 font-black uppercase text-[10px] underline">Subir algo ahora</button>
                                </div>
                            ` : tracks.map((t, index) => `
                                <div class="bg-zinc-900/40 p-4 rounded-[2rem] border border-white/5 flex items-center gap-4">
                                    <img src="${t.image || 'https://via.placeholder.com/100'}" class="w-16 h-16 rounded-2xl object-cover bg-zinc-800">
                                    <div class="flex-1">
                                        <h4 class="font-black text-sm uppercase tracking-tighter">${t.name}</h4>
                                        <span class="text-[9px] font-black uppercase text-zinc-500">${t.audioName || 'Beat Instrumental'}</span>
                                    </div>
                                    <button onclick="deleteTrack(${index})" class="w-10 h-10 text-red-500/50 hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            if (currentView === 'artists') {
                container.innerHTML = `
                    <div class="fade-in space-y-6">
                        <h2 class="text-2xl font-black italic uppercase tracking-tighter">Artistas</h2>
                        <div class="bg-zinc-900/60 p-6 rounded-[2.5rem] border border-white/5">
                            <input id="art-name" type="text" placeholder="Nombre del Artista..." class="w-full bg-black border border-zinc-800 p-4 rounded-xl font-bold mb-4 outline-none">
                            <button onclick="addArtist()" class="w-full bg-white text-black py-4 rounded-xl font-black uppercase text-[10px]">Añadir a la lista</button>
                        </div>
                        <div class="space-y-2">
                            ${artists.map((a, i) => `
                                <div class="bg-zinc-900/20 p-4 rounded-xl flex justify-between items-center border border-white/5">
                                    <span class="font-black uppercase text-xs text-zinc-300">${a}</span>
                                    <button onclick="deleteArtist(${i})" class="text-zinc-700"><i class="fa-solid fa-x"></i></button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
        }

        // --- LÓGICA DE NEGOCIO ---
        function processFile(input, type) {
            const file = input.files[0];
            if(!file) return;

            if(type === 'audio') {
                uploadForm.audioName = file.name;
                render();
            } else {
                const reader = new FileReader();
                reader.onload = (e) => {
                    uploadForm.image = e.target.result;
                    render();
                }
                reader.readAsDataURL(file);
            }
        }

        function saveTrack() {
            if(!uploadForm.name) return toast("Ponle un nombre a la pista");
            
            tracks.push({...uploadForm, date: new Date().toISOString()});
            localStorage.setItem('jaddy_tracks', JSON.stringify(tracks));
            
            // Limpiar
            uploadForm = { name: '', image: null, audioName: '', isExclusive: false };
            toast("¡Pista publicada con éxito!");
            router('catalog');
        }

        function deleteTrack(i) {
            tracks.splice(i, 1);
            localStorage.setItem('jaddy_tracks', JSON.stringify(tracks));
            render();
        }

        function addArtist() {
            const input = document.getElementById('art-name');
            if(!input.value) return;
            artists.push(input.value);
            localStorage.setItem('jaddy_artists', JSON.stringify(artists));
            input.value = '';
            render();
        }

        function deleteArtist(i) {
            artists.splice(i, 1);
            localStorage.setItem('jaddy_artists', JSON.stringify(artists));
            render();
        }

        function toast(msg) {
            const t = document.createElement('div');
            t.className = "fixed top-20 left-1/2 -translate-x-1/2 bg-yellow-500 text-black px-6 py-3 rounded-full font-black text-[10px] uppercase shadow-2xl z-[100]";
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        // Iniciar app
        window.onload = () => router('home');
    </script>
</body>
</html>

```
