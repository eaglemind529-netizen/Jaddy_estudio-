```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaddy Records Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0a0a0a; color: #eee; font-family: sans-serif; }
        .card { background: #151515; border: 1px solid #222; border-radius: 16px; }
        .accent-bg { background: linear-gradient(135deg, #9333ea, #4f46e5); }
        .accent-text { color: #a855f7; }
        input, select { background: #1f1f1f !important; border: 1px solid #333 !important; color: white !important; }
        .preview-box { border: 2px dashed #333; transition: all 0.3s; }
        .preview-box:hover { border-color: #9333ea; background: #1a1a1a; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Encabezado -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-black italic tracking-tighter uppercase">JADDY <span class="accent-text">RECORDS</span></h1>
                <p class="text-xs opacity-50 font-bold uppercase tracking-widest">Panel de Administración</p>
            </div>
            <div class="text-right">
                <span id="connection-status" class="text-[10px] bg-green-500/10 text-green-500 px-3 py-1 rounded-full border border-green-500/20">
                    <i class="fa-solid fa-circle text-[6px] mr-1 mb-0.5"></i> SISTEMA ACTIVO
                </span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Formulario de Carga -->
            <div class="lg:col-span-1">
                <div class="card p-6 sticky top-8">
                    <h2 class="text-sm font-bold uppercase mb-6 opacity-70 italic">Subir Nuevo Beat</h2>
                    
                    <div class="space-y-4">
                        <!-- Imagen -->
                        <div class="relative">
                            <input type="file" id="img-input" accept="image/*" class="hidden">
                            <label for="img-input" id="img-label" class="preview-box w-full aspect-square rounded-xl flex flex-col items-center justify-center cursor-pointer overflow-hidden">
                                <i class="fa-solid fa-cloud-arrow-up text-2xl mb-2 opacity-20"></i>
                                <span class="text-[10px] font-bold opacity-40 uppercase">Portada del Beat</span>
                            </label>
                        </div>

                        <!-- Datos -->
                        <div>
                            <label class="text-[10px] font-bold opacity-40 uppercase ml-1">Nombre</label>
                            <input type="text" id="name-input" placeholder="Ej: Trap King" class="w-full p-3 rounded-lg mt-1 outline-none focus:ring-1 ring-purple-500">
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-[10px] font-bold opacity-40 uppercase ml-1">Tipo</label>
                                <select id="cat-input" class="w-full p-3 rounded-lg mt-1 outline-none cursor-pointer">
                                    <option value="venta">Venta ($)</option>
                                    <option value="free">Uso Libre</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold opacity-40 uppercase ml-1">Precio</label>
                                <input type="number" id="price-input" placeholder="29.99" class="w-full p-3 rounded-lg mt-1 outline-none">
                            </div>
                        </div>

                        <!-- Audio -->
                        <div>
                            <input type="file" id="audio-input" accept="audio/*" class="hidden">
                            <label for="audio-input" id="audio-label" class="w-full p-3 bg-white/5 border border-white/10 rounded-lg flex items-center justify-center cursor-pointer hover:bg-white/10 transition-all">
                                <i class="fa-solid fa-music mr-2 text-purple-500"></i>
                                <span class="text-xs font-bold uppercase" id="audio-text">Seleccionar Audio</span>
                            </label>
                        </div>

                        <button id="btn-publish" class="w-full accent-bg py-4 rounded-xl font-black uppercase text-xs tracking-widest mt-4 shadow-lg shadow-purple-500/20 active:scale-95 transition-all">
                            Publicar Beat
                        </button>

                        <div id="loading-msg" class="hidden mt-4 text-center">
                            <p class="text-[10px] font-bold text-purple-400 animate-pulse">SUBIENDO ARCHIVOS... POR FAVOR ESPERA</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Lista de Beats (Feed) -->
            <div class="lg:col-span-2">
                <h3 class="text-sm font-bold uppercase mb-6 opacity-70 italic flex items-center">
                    <i class="fa-solid fa-list-ul mr-2"></i> Mi Catálogo
                </h3>
                <div id="beats-feed" class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    <!-- Los beats aparecerán aquí -->
                </div>
                <div id="empty-msg" class="hidden text-center py-20 card opacity-30">
                    <i class="fa-solid fa-compact-disc text-4xl mb-4"></i>
                    <p class="text-xs font-bold uppercase">No hay beats publicados aún</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase y Lógica -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // CONFIGURACIÓN AUTOMÁTICA
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'jaddy-records-default';

        let imgData = null;
        let audioData = null;

        // Iniciar Sesión para poder guardar datos
        signInAnonymously(auth).catch(console.error);

        // Referencia a la colección de Beats
        const beatsRef = collection(db, 'artifacts', appId, 'public', 'data', 'beats');

        // Escuchar cambios en la base de datos (Ver los beats en tiempo real)
        onSnapshot(beatsRef, (snapshot) => {
            const feed = document.getElementById('beats-feed');
            const empty = document.getElementById('empty-msg');
            
            if (snapshot.empty) {
                empty.classList.remove('hidden');
                feed.innerHTML = "";
                return;
            }

            empty.classList.add('hidden');
            feed.innerHTML = "";
            
            snapshot.forEach((doc) => {
                const beat = doc.data();
                const card = document.createElement('div');
                card.className = "card overflow-hidden group hover:border-purple-500/50 transition-all";
                card.innerHTML = `
                    <div class="relative aspect-square">
                        <img src="${beat.image || 'https://via.placeholder.com/300'}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-all">
                             <i class="fa-solid fa-play text-2xl text-white"></i>
                        </div>
                    </div>
                    <div class="p-3">
                        <h4 class="text-[10px] font-black uppercase truncate">${beat.name}</h4>
                        <div class="flex justify-between items-center mt-1">
                            <span class="text-[9px] font-bold text-purple-400">${beat.category === 'venta' ? '$' + beat.price : 'GRATIS'}</span>
                            <span class="text-[8px] opacity-30">${new Date(beat.createdAt?.seconds * 1000).toLocaleDateString() || 'Reciente'}</span>
                        </div>
                    </div>
                `;
                feed.appendChild(card);
            });
        }, (error) => {
            console.error("Error al leer datos:", error);
        });

        // Manejar selección de imagen
        document.getElementById('img-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    imgData = event.target.result;
                    document.getElementById('img-label').innerHTML = `<img src="${imgData}" class="w-full h-full object-cover">`;
                };
                reader.readAsDataURL(file);
            }
        });

        // Manejar selección de audio
        document.getElementById('audio-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    audioData = event.target.result;
                    document.getElementById('audio-text').innerText = "AUDIO LISTO ✓";
                    document.getElementById('audio-label').classList.add('border-purple-500', 'bg-purple-500/10');
                };
                reader.readAsDataURL(file);
            }
        });

        // Botón Publicar
        document.getElementById('btn-publish').addEventListener('click', async function() {
            const name = document.getElementById('name-input').value;
            const price = document.getElementById('price-input').value || "0";
            const category = document.getElementById('cat-input').value;
            const loading = document.getElementById('loading-msg');

            if (!name || !audioData) {
                alert("Por favor, ponle un nombre y selecciona un archivo de audio.");
                return;
            }

            this.disabled = true;
            this.style.opacity = "0.5";
            loading.classList.remove('hidden');

            try {
                await addDoc(beatsRef, {
                    name: name,
                    price: price,
                    category: category,
                    image: imgData,
                    audio: audioData,
                    createdAt: serverTimestamp()
                });

                // Limpiar formulario
                document.getElementById('name-input').value = "";
                document.getElementById('price-input').value = "";
                document.getElementById('img-label').innerHTML = `
                    <i class="fa-solid fa-cloud-arrow-up text-2xl mb-2 opacity-20"></i>
                    <span class="text-[10px] font-bold opacity-40 uppercase">Portada del Beat</span>
                `;
                document.getElementById('audio-text').innerText = "Seleccionar Audio";
                document.getElementById('audio-label').className = "w-full p-3 bg-white/5 border border-white/10 rounded-lg flex items-center justify-center cursor-pointer hover:bg-white/10 transition-all";
                imgData = null;
                audioData = null;
                
                alert("¡Beat publicado con éxito!");

            } catch (err) {
                console.error("Error al publicar:", err);
                alert("Hubo un error al guardar. Asegúrate de que el audio no sea demasiado pesado.");
            } finally {
                this.disabled = false;
                this.style.opacity = "1";
                loading.classList.add('hidden');
            }
        });

    </script>
</body>
</html>

```
