```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaddy Studio | Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: white;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .accent-gradient {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
        }

        .text-gradient {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hide { display: none !important; }

        .beat-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .beat-card:hover {
            transform: translateY(-10px);
            border-color: rgba(168, 85, 247, 0.5);
        }

        /* Estilo del Mini Reproductor de YouTube */
        #youtube-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            height: 80px;
            z-index: 100;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: black;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body class="min-h-screen pb-32">

    <!-- Fondo dinámico -->
    <div class="fixed inset-0 -z-10">
        <div class="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-purple-600/10 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-indigo-600/10 blur-[120px] rounded-full"></div>
    </div>

    <!-- Navegación -->
    <nav class="h-24 flex items-center justify-between px-8 sticky top-0 z-50 bg-black/60 backdrop-blur-2xl border-b border-white/5">
        <div>
            <h1 class="text-2xl font-black italic tracking-tighter uppercase leading-none">
                JADDY <span class="text-purple-500 underline">STUDIO</span>
            </h1>
            <p class="text-[9px] font-bold text-gray-500 uppercase tracking-[0.3em] mt-1 text-center">Marketplace</p>
        </div>
        <div class="hidden md:flex gap-2 bg-white/5 p-1 rounded-full border border-white/10">
            <button onclick="setFilter('all')" id="btn-all" class="px-5 py-2 rounded-full text-[10px] font-black uppercase transition-all bg-purple-600">Todos</button>
            <button onclick="setFilter('paid')" id="btn-paid" class="px-5 py-2 rounded-full text-[10px] font-black uppercase transition-all text-gray-400">Premium</button>
            <button onclick="setFilter('free')" id="btn-free" class="px-5 py-2 rounded-full text-[10px] font-black uppercase transition-all text-gray-400">Gratis</button>
        </div>
        <div class="w-10"></div> <!-- Spacer -->
    </nav>

    <main class="max-w-7xl mx-auto px-6 pt-16">
        <header class="mb-16">
            <h2 class="text-6xl md:text-8xl font-black italic uppercase tracking-tighter leading-[0.85] mb-6">
                TU MÚSICA <br>
                <span class="text-gradient">REAL AQUÍ</span>
            </h2>
            <p class="text-gray-400 font-medium max-w-md">Cargando tus beats directamente desde la base de datos de Jaddy Studio.</p>
        </header>

        <div id="beats-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <!-- Cargando... -->
        </div>
    </main>

    <!-- Mini Reproductor Flotante de YouTube -->
    <div id="youtube-container" class="hide">
        <div id="player"></div>
        <div class="absolute top-0 left-0 w-full h-full bg-black/40 pointer-events-none flex items-center px-4">
             <div class="flex flex-col">
                <span class="text-[8px] font-black uppercase text-purple-500 tracking-widest">Reproduciendo</span>
                <span id="current-song-title" class="text-[10px] font-bold text-white truncate w-40">Título del Beat</span>
             </div>
             <button onclick="stopMusic()" class="ml-auto pointer-events-auto bg-white/10 hover:bg-white/20 p-2 rounded-full">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="2" stroke-linecap="round"></path></svg>
             </button>
        </div>
    </div>

    <!-- Modal de Checkout -->
    <div id="payment-modal" class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/90 backdrop-blur-md hide">
        <div class="glass w-full max-w-lg rounded-[40px] overflow-hidden relative border border-white/10">
            <button onclick="closeModal()" class="absolute top-8 right-8 text-2xl text-gray-500">&times;</button>
            <div class="p-10" id="modal-content"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, doc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDIaAvpJZrJjQUKsh6KGD7gALJNskto8A8",
            authDomain: "jaddy-estudio.firebaseapp.com",
            projectId: "jaddy-estudio",
            storageBucket: "jaddy-estudio.firebasestorage.app",
            messagingSenderId: "968903268866",
            appId: "1:968903268866:web:e2b6895e8acff18178e51b"
        };

        const APP_ID = "jaddy_studio_v1";
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let allBeats = [];
        let paymentInfo = {};
        let currentFilter = 'all';

        // Carga el API de YouTube
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        let ytPlayer;
        window.onYouTubeIframeAPIReady = () => {
            ytPlayer = new YT.Player('player', {
                height: '80',
                width: '300',
                playerVars: { 'autoplay': 0, 'controls': 0, 'modestbranding': 1 },
                events: { 'onReady': () => console.log("YT Ready") }
            });
        };

        // Extraer ID de YouTube de cualquier URL
        function getYoutubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        window.togglePlay = (url, name) => {
            const videoId = getYoutubeId(url);
            if (!videoId) {
                console.error("URL no es de YouTube válida:", url);
                return;
            }

            document.getElementById('youtube-container').classList.remove('hide');
            document.getElementById('current-song-title').innerText = name;
            
            ytPlayer.loadVideoById(videoId);
            ytPlayer.playVideo();
        };

        window.stopMusic = () => {
            ytPlayer.stopVideo();
            document.getElementById('youtube-container').classList.add('hide');
        };

        window.setFilter = (f) => {
            currentFilter = f;
            renderBeats();
            updateFilterButtons();
        };

        const updateFilterButtons = () => {
            ['all', 'paid', 'free'].forEach(f => {
                const btn = document.getElementById(`btn-${f}`);
                if(btn) btn.className = f === currentFilter 
                    ? "px-5 py-2 rounded-full text-[10px] font-black uppercase transition-all bg-purple-600 text-white"
                    : "px-5 py-2 rounded-full text-[10px] font-black uppercase transition-all text-gray-400";
            });
        };

        const renderBeats = () => {
            const grid = document.getElementById('beats-grid');
            grid.innerHTML = "";

            const filtered = allBeats.filter(b => {
                if (currentFilter === 'free') return b.type === 'free';
                if (currentFilter === 'paid') return b.type === 'paid';
                return true;
            });

            filtered.forEach(beat => {
                const card = document.createElement('div');
                card.className = "beat-card glass p-8 rounded-[40px] flex flex-col h-[500px]";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-6">
                        <button onclick="togglePlay('${beat.link}', '${beat.name}')" 
                                class="w-14 h-14 rounded-2xl bg-white/10 hover:bg-purple-600 flex items-center justify-center transition-all">
                            <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                        </button>
                        <div class="text-right">
                            <span class="text-[9px] font-black text-purple-500 uppercase tracking-widest block">${beat.genre || 'BEAT'}</span>
                            <span class="text-3xl font-black italic tracking-tighter">${beat.type === 'free' ? 'GRATIS' : '$' + beat.price}</span>
                        </div>
                    </div>

                    <div class="mb-6">
                        <h3 class="text-2xl font-black uppercase italic truncate">${beat.name}</h3>
                        <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest">Prod. by Jaddy Studio</p>
                    </div>

                    <div class="flex-1 bg-gradient-to-br from-white/5 to-transparent rounded-3xl mb-8 flex items-center justify-center border border-white/5">
                         <svg class="w-12 h-12 text-white/10" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"></path></svg>
                    </div>

                    <div class="flex gap-3">
                        <button onclick="openCheckout('${beat.id}')" class="flex-1 accent-gradient py-4 rounded-xl text-[10px] font-black uppercase tracking-widest active:scale-95 transition-all">
                            Comprar / Info
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        window.openCheckout = (id) => {
            const beat = allBeats.find(b => b.id === id);
            const content = document.getElementById('modal-content');
            
            content.innerHTML = `
                <h4 class="text-2xl font-black italic uppercase mb-2">${beat.name}</h4>
                <p class="text-purple-500 text-[10px] font-black uppercase tracking-widest mb-8">Detalles de Licencia</p>
                <div class="bg-white/5 p-6 rounded-2xl border border-white/10 mb-8">
                    <p class="text-gray-400 text-sm leading-relaxed">
                        Esta licencia incluye archivos de alta calidad (WAV/MP3). <br><br>
                        Para completar el pago de <b>$${beat.price}</b>, puedes usar Pago Móvil: <br>
                        <span class="text-white font-bold">${paymentInfo.pago_movil || 'Consultar por WhatsApp'}</span>
                    </p>
                </div>
                <a href="https://wa.me/584120000000?text=Hola Jaddy, quiero el beat: ${beat.name}" target="_blank" 
                   class="block w-full text-center bg-white text-black py-4 rounded-xl font-black uppercase text-[10px] tracking-widest">
                   Confirmar por WhatsApp
                </a>
            `;
            document.getElementById('payment-modal').classList.remove('hide');
        };

        window.closeModal = () => document.getElementById('payment-modal').classList.add('hide');

        const init = async () => {
            try {
                await signInAnonymously(auth);
                onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'beats'), (snap) => {
                    allBeats = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderBeats();
                });
                onSnapshot(doc(db, 'artifacts', APP_ID, 'public', 'data', 'payments'), (snap) => {
                    if(snap.exists()) paymentInfo = snap.data();
                });
            } catch (e) { console.error("Firebase Error:", e); }
        };

        init();
    </script>
</body>
</html>
