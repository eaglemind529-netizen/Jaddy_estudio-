<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaddy Studio - Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #050505; color: #fff; overflow-x: hidden; }
        .beat-row { background: #0d0d0d; border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.2s; }
        .beat-row:hover { background: #141414; border-left: 4px solid #ea580c; }
        .glass { background: rgba(13, 13, 13, 0.95); backdrop-filter: blur(20px); border-top: 1px solid #ea580c; }
        #purchaseModal { backdrop-filter: blur(8px); background: rgba(0,0,0,0.8); }
        .tab-active { background: #ea580c; color: white; }
        .filter-btn.active { background: #ea580c; color: white; border-color: #ea580c; }
    </style>
</head>
<body class="pb-64">

    <header class="py-12 px-6 text-center border-b border-white/5 relative">
        <button onclick="window.shareCatalog()" class="absolute top-6 left-6 text-neutral-500 hover:text-white transition-colors">
            <i data-lucide="share-2" class="w-6 h-6"></i>
        </button>
        <h1 class="text-4xl md:text-6xl font-black italic uppercase tracking-tighter">THE <span class="text-orange-500">MARKET</span></h1>
        <p class="text-[9px] font-bold text-neutral-500 uppercase tracking-[0.4em] mt-2">Jaddy Studio Professional Production</p>
        
        <div class="flex justify-center gap-2 mt-8">
            <button onclick="window.filterBeats('all')" id="filter-all" class="filter-btn active px-4 py-1.5 rounded-full border border-white/10 text-[9px] font-black uppercase tracking-widest transition-all">Todo</button>
            <button onclick="window.filterBeats('exclusiva')" id="filter-exclusiva" class="filter-btn px-4 py-1.5 rounded-full border border-white/10 text-[9px] font-black uppercase tracking-widest transition-all">Exclusivas</button>
            <button onclick="window.filterBeats('licencia')" id="filter-licencia" class="filter-btn px-4 py-1.5 rounded-full border border-white/10 text-[9px] font-black uppercase tracking-widest transition-all">Licencias</button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto mt-6 px-4">
        <div id="grid" class="flex flex-col gap-1"></div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDIaAvpJZrJjQUKsh6KGD7gALJNskto8A8",
            authDomain: "jaddy-estudio.firebaseapp.com",
            projectId: "jaddy-estudio",
            storageBucket: "jaddy-estudio.firebasestorage.app",
            messagingSenderId: "968903268866",
            appId: "1:968903268866:web:e2b6895e8acff18178e51b",
            measurementId: "G-SBBXXDD3TV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        let allBeats = [];
        let currentFilter = 'all';

        window.shareCatalog = () => {
            const shareData = {
                title: 'Jaddy Studio Marketplace',
                text: 'Mira el catálogo de beats profesionales:',
                url: window.location.href
            };
            if (navigator.share) navigator.share(shareData).catch(console.error);
            else {
                navigator.clipboard.writeText(window.location.href);
                alert("¡Enlace copiado al portapapeles!");
            }
        };

        signInAnonymously(getAuth(app)).then(() => {
            onSnapshot(collection(db, 'beats'), (snap) => {
                allBeats = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(b => b.visible === true);
                render();
            });
        });

        window.filterBeats = (filter) => {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`filter-${filter}`).classList.add('active');
            render();
        };

        function render() {
            const g = document.getElementById('grid');
            const filtered = allBeats.filter(b => currentFilter === 'all' || b.category === currentFilter);
            g.innerHTML = filtered.map((b, index) => `
                <div class="beat-row grid grid-cols-12 gap-4 items-center px-6 py-4 cursor-pointer">
                    <div class="col-span-1"><span class="text-[10px] font-mono text-neutral-700">${index + 1}</span></div>
                    <div class="col-span-8 flex flex-col">
                        <h3 class="text-xs font-black uppercase italic text-white">${b.title}</h3>
                        <p class="text-[9px] font-bold text-neutral-600 uppercase">PROD. ${b.producer || 'Jaddy Studio'}</p>
                    </div>
                    <div class="col-span-3 text-right">
                        <span class="text-sm font-black italic text-white">$${b.price}</span>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }
        lucide.createIcons();
    </script>
</body>
</html>
