```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaddy Studio - Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #fff;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .beat-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .beat-card:hover {
            background: rgba(234, 88, 12, 0.08);
            border-color: rgba(234, 88, 12, 0.3);
            transform: translateY(-5px);
        }
        /* Animación de las barras de audio */
        @keyframes pulse-audio {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }
        .audio-bar {
            width: 3px;
            background: #ea580c;
            border-radius: 2px;
            animation: pulse-audio 1s ease-in-out infinite;
        }
    </style>
</head>
<body class="pb-32">

    <!-- Hero / Header Section -->
    <header class="relative h-[45vh] flex items-center justify-center overflow-hidden border-b border-white/5">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-orange-600/20 via-black to-black"></div>
        <div class="relative z-10 text-center px-6">
            <div class="w-24 h-24 bg-white/5 rounded-[2.5rem] mx-auto mb-8 flex items-center justify-center border border-white/10 shadow-2xl backdrop-blur-xl">
                <i data-lucide="disc" class="w-12 h-12 text-orange-500 animate-[spin_10s_linear_infinite]"></i>
            </div>
            <h1 class="text-6xl md:text-8xl font-black italic tracking-tighter uppercase mb-4 leading-none">Jaddy <span class="text-orange-500">Studio</span></h1>
            <p class="text-neutral-400 font-bold tracking-[0.5em] text-[10px] uppercase">Marketplace de Instrumentales Exclusivos</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-6 -mt-16 relative z-20">
        
        <!-- Search Bar -->
        <div class="glass p-5 rounded-[2.5rem] mb-12 flex flex-col md:flex-row gap-4 items-center shadow-2xl">
            <div class="relative flex-1 w-full">
                <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-neutral-600 w-5 h-5"></i>
                <input type="text" id="searchInput" placeholder="Buscar por nombre o productor..." class="w-full bg-white/5 border-none rounded-2xl py-5 pl-14 pr-6 text-sm focus:ring-2 focus:ring-orange-500 transition-all outline-none text-white">
            </div>
            <div class="hidden md:flex gap-2">
                <div class="glass px-6 py-5 rounded-2xl text-[10px] font-black uppercase tracking-widest text-orange-500 border-orange-500/20">Recientes</div>
            </div>
        </div>

        <!-- Grid de Beats -->
        <div id="marketplaceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Cargando -->
            <div class="col-span-full py-32 text-center">
                <div class="inline-block animate-spin mb-6"><i data-lucide="refresh-cw" class="w-10 h-10 text-orange-600"></i></div>
                <p class="text-xs font-black uppercase tracking-[0.3em] text-neutral-600">Sincronizando Catálogo Real-Time...</p>
            </div>
        </div>
    </main>

    <!-- Global Floating Player (La Review de Compra) -->
    <div id="globalPlayer" class="hidden fixed bottom-6 left-6 right-6 z-[100] animate-in slide-in-from-bottom-20 duration-500">
        <div class="max-w-5xl mx-auto glass p-6 rounded-[3rem] shadow-[0_40px_100px_-15px_rgba(0,0,0,0.8)] border border-white/10">
            <div class="flex flex-col lg:flex-row items-center gap-8">
                
                <!-- Info Pista -->
                <div class="flex items-center gap-5 flex-1 w-full lg:w-1/4">
                    <div class="w-16 h-16 bg-gradient-to-br from-orange-500 to-red-600 rounded-3xl flex items-center justify-center shadow-xl">
                        <i data-lucide="music-2" class="text-white w-8 h-8"></i>
                    </div>
                    <div class="min-w-0">
                        <h4 id="playerTitle" class="text-lg font-black uppercase text-white truncate tracking-tighter">---</h4>
                        <p id="playerProducer" class="text-[10px] font-bold text-neutral-500 uppercase tracking-widest">---</p>
                    </div>
                </div>

                <!-- Media Player -->
                <div id="playerContainer" class="w-full lg:w-2/4"></div>

                <!-- Botón de WhatsApp Directo -->
                <div class="flex items-center gap-8 w-full lg:w-1/4 justify-between lg:justify-end">
                    <div class="text-right">
                        <p id="playerPrice" class="text-3xl font-black italic text-white leading-none">$00.00</p>
                        <p id="playerSaleType" class="text-[9px] font-black text-orange-500 uppercase tracking-widest mt-1">---</p>
                    </div>
                    <button id="mainBuyBtn" class="bg-white text-black px-10 py-5 rounded-2xl font-black uppercase text-[11px] tracking-widest hover:bg-green-600 hover:text-white transition-all active:scale-95 shadow-2xl flex items-center gap-3">
                        <i data-lucide="message-circle" class="w-4 h-4"></i> Comprar
                    </button>
                    <button onclick="closePlayer()" class="p-2 text-neutral-700 hover:text-white transition-colors"><i data-lucide="x"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'jaddy-studio-pro';

        let allBeats = [];

        // Conexión Real-time
        signInAnonymously(auth);
        onAuthStateChanged(auth, (user) => {
            if (user) {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'beats'), (snap) => {
                    allBeats = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderMarketplace(allBeats);
                });
            }
        });

        function renderMarketplace(list) {
            const grid = document.getElementById('marketplaceGrid');
            if(list.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center opacity-30"><p class="font-black uppercase text-[10px]">Esperando Beats...</p></div>`;
                return;
            }

            grid.innerHTML = list.map(b => `
                <div class="beat-card glass p-8 rounded-[3rem] flex flex-col group border border-white/5">
                    <div class="flex justify-between items-start mb-8">
                        <div class="w-14 h-14 bg-white/5 rounded-2xl flex items-center justify-center group-hover:bg-orange-600 transition-all duration-500 shadow-inner">
                            <i data-lucide="music" class="w-7 h-7 text-neutral-700 group-hover:text-white transition-all"></i>
                        </div>
                        <span class="text-[9px] font-black uppercase tracking-widest text-orange-500 bg-orange-500/10 px-4 py-2 rounded-full border border-orange-500/20">
                            ${b.saleType}
                        </span>
                    </div>

                    <h3 class="text-xl font-black uppercase italic tracking-tighter text-white mb-1 truncate">${b.title}</h3>
                    <p class="text-[10px] font-bold text-neutral-500 uppercase tracking-widest mb-10 flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-orange-600 animate-pulse"></span> Prod. ${b.producer}
                    </p>

                    <div class="mt-auto flex items-end justify-between">
                        <div>
                            <span class="text-[9px] font-black text-neutral-600 uppercase block mb-1">Precio Final</span>
                            <span class="text-3xl font-black italic text-white leading-none">$${b.price}</span>
                        </div>
                        <button onclick="openPlayer('${b.id}')" class="w-16 h-16 bg-white rounded-3xl flex items-center justify-center text-black hover:bg-orange-600 hover:text-white transition-all active:scale-90 shadow-xl shadow-white/5">
                            <i data-lucide="play" class="w-6 h-6 fill-current"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.openPlayer = (id) => {
            const beat = allBeats.find(b => b.id === id);
            const player = document.getElementById('globalPlayer');
            const container = document.getElementById('playerContainer');
            
            player.classList.remove('hidden');
            document.getElementById('playerTitle').innerText = beat.title;
            document.getElementById('playerProducer').innerText = `PROD. ${beat.producer}`;
            document.getElementById('playerPrice').innerText = `$${beat.price}`;
            document.getElementById('playerSaleType').innerText = beat.saleType;

            if(beat.type === 'youtube') {
                container.innerHTML = `<div class="aspect-video w-full rounded-2xl overflow-hidden border border-white/10 h-32"><iframe width="100%" height="100%" src="https://www.youtube.com/embed/${beat.url}?autoplay=1" frameborder="0"></iframe></div>`;
            } else {
                container.innerHTML = `
                    <div class="flex items-center gap-1 justify-center h-8 mb-4">
                        ${Array(20).fill('<div class="audio-bar" style="animation-delay: '+(Math.random())+'s"></div>').join('')}
                    </div>
                    <audio src="${beat.url}" controls autoPlay class="w-full h-12 invert brightness-150"></audio>
                `;
            }

            // BOTÓN DE COMPRA: Automatización de WhatsApp
            document.getElementById('mainBuyBtn').onclick = () => {
                const text = `¡Hola Jaddy Studio! 🎹 Me interesa comprar el beat: "${beat.title}" ($${beat.price}). Por favor, confírmame disponibilidad.`;
                // Se quitan espacios y caracteres raros del número guardado
                const phone = beat.whatsapp.replace(/\D/g, '');
                window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
            };
        };

        window.closePlayer = () => {
            document.getElementById('globalPlayer').classList.add('hidden');
            document.getElementById('playerContainer').innerHTML = '';
        };

        // Buscador Inteligente
        document.getElementById('searchInput').oninput = (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = allBeats.filter(b => 
                b.title.toLowerCase().includes(val) || 
                b.producer.toLowerCase().includes(val)
            );
            renderMarketplace(filtered);
        };

        lucide.createIcons();
    </script>
</body>
</html>

```
