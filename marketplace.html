    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, doc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDIaAvpJZrJjQUKsh6KGD7gALJNskto8A8",
            authDomain: "jaddy-estudio.firebaseapp.com",
            projectId: "jaddy-estudio",
            storageBucket: "jaddy-estudio.firebasestorage.app",
            messagingSenderId: "968903268866",
            appId: "1:968903268866:web:e2b6895e8acff18178e51b"
        };

        const APP_ID = "jaddy_studio_v1";
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let allBeats = [];
        let paymentInfo = {};
        let currentFilter = 'all';
        let currentPlayingId = null;

        const audioPlayer = document.getElementById('audio-player');

        // Función para reproducir audio (Con Fallback funcional para el preview)
        window.togglePlay = (url, id) => {
            const btn = document.getElementById(`play-btn-${id}`);
            
            if (currentPlayingId === id) {
                if (!audioPlayer.paused) {
                    audioPlayer.pause();
                    btn.innerHTML = `<svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>`;
                    btn.classList.remove('playing-pulse', 'bg-purple-600');
                } else {
                    audioPlayer.play();
                    btn.innerHTML = `<svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>`;
                    btn.classList.add('playing-pulse', 'bg-purple-600');
                }
                return;
            }

            // Reset anterior
            if (currentPlayingId) {
                const oldBtn = document.getElementById(`play-btn-${currentPlayingId}`);
                if (oldBtn) {
                    oldBtn.innerHTML = `<svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>`;
                    oldBtn.classList.remove('playing-pulse', 'bg-purple-600');
                }
            }

            // Aquí está el truco: Usamos un audio real para el preview
            // En tu repositorio real, aquí pondrías la URL directa del MP3
            audioPlayer.src = "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"; 
            audioPlayer.play();
            
            currentPlayingId = id;
            btn.innerHTML = `<svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>`;
            btn.classList.add('playing-pulse', 'bg-purple-600');
        };

        window.setFilter = (f) => {
            currentFilter = f;
            renderBeats();
            updateFilterButtons();
        };

        const updateFilterButtons = () => {
            ['all', 'paid', 'free'].forEach(f => {
                const btn = document.getElementById(`btn-${f}`);
                if(!btn) return;
                btn.className = f === currentFilter 
                    ? "px-5 py-2 rounded-full text-[10px] font-black uppercase transition-all bg-purple-600 text-white"

        const renderBeats = () => {

            const filtered = allBeats.filter(b => {
                if (currentFilter === 'free') return b.type === 'free';
                if (currentFilter === 'paid') return b.type === 'paid';
                return true;
            });

            filtered.forEach(beat => {
                const card = document.createElement('div');

                                class="w-16 h-16 rounded-2xl bg-white/5 hover:bg-white/10 flex items-center justify-center transition-all duration-300">
                            <svg class="w-6 h-6 fill-current text-white" viewBox="0 0 24 24">

                            </svg>
                        </button>
                        <div class="text-right">

                            <span class="text-4xl font-black italic tracking-tighter text-white">${beat.type === 'free' ? 'FREE' : '$' + beat.price}</span>
                        </div>
                    </div>

                    <div class="mb-6">
                        <h3 class="text-3xl font-black uppercase italic mb-2 tracking-tight leading-none">${beat.name}</h3>
                        <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest">Masterizado por Jaddy Studio</p>
                    </div>

                    <!-- Visual Carátula Artística -->
                    <div class="flex-1 rounded-[32px] overflow-hidden bg-[#0d0d0d] border border-white/5 mb-8 relative group">
                        <div class="absolute inset-0 bg-gradient-to-t from-purple-900/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <div class="absolute inset-0 flex items-center justify-center">
                            <div class="text-center opacity-20">
                                <h4 class="text-2xl font-black italic tracking-tighter uppercase leading-none mb-1">JADDY</h4>
                                <div class="h-[2px] w-12 bg-white mx-auto"></div>
                            </div>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <button onclick="openCheckout('${beat.id}')" class="flex-1 bg-white/5 border border-white/5 py-5 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-white/10 transition-all">
                            Detalles
                        </button>
                        <button onclick="openCheckout('${beat.id}')" class="flex-1 accent-gradient py-5 rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-xl shadow-purple-600/20 active:scale-95 transition-all">
                            Comprar
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        window.openCheckout = (id) => {
            const beat = allBeats.find(b => b.id === id);
            if(!beat) return;
            document.getElementById('modal-beat-name').innerText = beat.name;
            const container = document.getElementById('payment-content');
            
            if(beat.type === 'free') {
                container.innerHTML = `
                    <div class="p-8 bg-purple-500/5 rounded-3xl border border-purple-500/20 text-center mb-6">
                        <p class="text-purple-400 text-xs font-bold uppercase tracking-widest">Uso Libre bajo Créditos</p>
                    </div>
                    <a href="${beat.link}" target="_blank" class="block w-full text-center bg-white text-black py-5 rounded-2xl font-black uppercase text-xs">Ir a Descarga</a>
                `;
            } else {
                let m = "";
                if(paymentInfo.pago_movil) m += `
                    <div class="p-6 bg-white/5 rounded-3xl border border-white/10">
                        <span class="text-[9px] font-black text-purple-500 uppercase block mb-3 tracking-widest">Datos Pago Móvil</span>
                        <p class="text-sm font-bold text-gray-300 leading-relaxed">${paymentInfo.pago_movil.replace(/\n/g, '<br>')}</p>
                    </div>`;
                
                container.innerHTML = `
                    <div class="flex justify-between items-center mb-8 px-2">
                        <span class="text-gray-500 text-xs font-bold uppercase tracking-widest">Licencia MP3 + WAV:</span>
                        <span class="text-3xl font-black text-white">$${beat.price}</span>
                    </div>
                    ${m}
                    <a href="https://wa.me/584120000000?text=Hola, quiero comprar el beat: ${beat.name}" target="_blank" class="block w-full text-center bg-white text-black py-5 rounded-2xl font-black uppercase text-xs mt-8">Confirmar por WhatsApp</a>
                `;
            }
            document.getElementById('payment-modal').classList.remove('hide');
        };

        window.closeModal = () => document.getElementById('payment-modal').classList.add('hide');

        const init = async () => {
            try {
                await signInAnonymously(auth);
                onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'beats'), (snap) => {
                    allBeats = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderBeats();
                });
                onSnapshot(doc(db, 'artifacts', APP_ID, 'public', 'data', 'payments'), (snap) => {
                    if(snap.exists()) paymentInfo = snap.data();
                });
            } catch (e) { console.error("Error Firebase:", e); }
        };

        init();
    </script>
</body>
