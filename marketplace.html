<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaddy Studio | Marketplace</title>
    <!-- Tailwind y Fuentes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- React Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: white;
            overflow-x: hidden;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .beat-card:hover {
            border-color: rgba(168, 85, 247, 0.4);
            transform: translateY(-4px);
        }
        .purple-glow {
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.15);
        }
        /* Ocultar scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Firebase SDKs con manejo de errores global -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, enableIndexedDbPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseConfig = {
            apiKey: "AIzaSyDIaAvpJZrJjQUKsh6KGD7gALJNskto8A8",
            authDomain: "jaddy-estudio.firebaseapp.com",
            projectId: "jaddy-estudio",
            storageBucket: "jaddy-estudio.firebasestorage.app",
            messagingSenderId: "968903268866",
            appId: "1:968903268866:web:e2b6895e8acff18178e51b"
        };
        
        try {
            window.fbApp = initializeApp(window.FirebaseConfig);
            window.fbAuth = getAuth(window.fbApp);
            window.fbDb = getFirestore(window.fbApp);
            window.fbCollection = collection;
            window.fbOnSnapshot = onSnapshot;
            window.fbSignIn = signInAnonymously;
            
            // Intentar habilitar persistencia local para modo offline real
            enableIndexedDbPersistence(window.fbDb).catch((err) => {
                console.warn("Persistencia offline no disponible:", err.code);
            });
        } catch (e) {
            console.error("Error inicializando Firebase:", e);
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Datos de respaldo por si no hay señal
        const BACKUP_BEATS = [
            {
                id: 'backup-1',
                name: 'Modo Offline Active',
                producer: 'Jaddy Studio',
                price: 30,
                category: 'venta',
                image: 'https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?q=80&w=400&h=400&auto=format&fit=crop',
                audio: '',
                paymentMethods: 'Sin conexión: Por favor, reconéctate para ver métodos actualizados.'
            },
            {
                id: 'backup-2',
                name: 'Esperando Señal',
                producer: 'Jaddy Studio',
                price: 0,
                category: 'free',
                image: 'https://images.unsplash.com/photo-1514525253361-bee8718a300a?q=80&w=400&h=400&auto=format&fit=crop',
                audio: '',
                paymentMethods: 'WhatsApp: +58 412-0000000'
            }
        ];

        const App = () => {
            const [beats, setBeats] = useState([]);
            const [loading, setLoading] = useState(true);
            const [filter, setFilter] = useState('all');
            const [selectedBeat, setSelectedBeat] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentId, setCurrentId] = useState(null);
            const [isOffline, setIsOffline] = useState(!navigator.onLine);
            
            const audioRef = useRef(new Audio());
            const APP_ID = "jaddy-records-v2";

            useEffect(() => {
                // Detectar cambios de red
                const handleOnline = () => setIsOffline(false);
                const handleOffline = () => setIsOffline(true);
                window.addEventListener('online', handleOnline);
                window.addEventListener('offline', handleOffline);

                const init = async () => {
                    // Si no hay internet desde el inicio, cargar backups rápido
                    if (!navigator.onLine) {
                        setBeats(BACKUP_BEATS);
                        setLoading(false);
                        return;
                    }

                    try {
                        if (!window.fbSignIn) throw new Error("Firebase no cargó");
                        
                        await window.fbSignIn(window.fbAuth);
                        const q = window.fbCollection(window.fbDb, 'artifacts', APP_ID, 'public', 'data', 'beats');
                        
                        const unsubscribe = window.fbOnSnapshot(q, (snapshot) => {
                            if (snapshot.empty) {
                                setBeats(BACKUP_BEATS);
                            } else {
                                const items = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                                setBeats(items);
                            }
                            setLoading(false);
                        }, (err) => {
                            console.error("Error Firestore:", err);
                            setBeats(BACKUP_BEATS);
                            setLoading(false);
                        });

                        return () => unsubscribe();
                    } catch (e) {
                        console.error("Modo Offline Activado por error:", e);
                        setBeats(BACKUP_BEATS);
                        setLoading(false);
                    }
                };

                init();
                
                // Timer de seguridad: si tarda más de 4 segundos, mostrar backup
                const timer = setTimeout(() => {
                    if (loading) {
                        setBeats(BACKUP_BEATS);
                        setLoading(false);
                    }
                }, 4000);

                return () => {
                    window.removeEventListener('online', handleOnline);
                    window.removeEventListener('offline', handleOffline);
                    clearTimeout(timer);
                };
            }, []);

            const togglePlay = (beat) => {
                if (!beat.audio) return;
                if (currentId === beat.id) {
                    if (isPlaying) {
                        audioRef.current.pause();
                        setIsPlaying(false);
                    } else {
                        audioRef.current.play();
                        setIsPlaying(true);
                    }
                } else {
                    audioRef.current.src = beat.audio;
                    audioRef.current.play();
                    setCurrentId(beat.id);
                    setIsPlaying(true);
                }
            };

            const filteredBeats = beats.filter(b => {
                if (filter === 'free') return b.category === 'free';
                if (filter === 'premium') return b.category === 'venta';
                return true;
            });

            return (
                <div className="min-h-screen pb-24">
                    {/* Alerta Offline */}
                    {isOffline && (
                        <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[100] bg-red-600/80 backdrop-blur-md px-4 py-1 rounded-full text-[10px] font-black uppercase tracking-widest flex items-center gap-2 border border-red-500/50 shadow-2xl animate-pulse">
                            <i className="fa-solid fa-wifi-slash"></i> Sin Conexión - Modo Offline
                        </div>
                    )}

                    {/* Decoración de fondo */}
                    <div className="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none">
                        <div className="absolute top-[-20%] right-[-10%] w-[600px] h-[600px] bg-purple-600/10 blur-[150px] rounded-full"></div>
                        <div className="absolute bottom-[-20%] left-[-10%] w-[600px] h-[600px] bg-blue-600/10 blur-[150px] rounded-full"></div>
                    </div>

                    {/* Header Nav */}
                    <nav className="sticky top-0 z-50 glass border-b border-white/5 px-6 h-20 flex items-center justify-between">
                        <div className="flex flex-col">
                            <h1 className="text-2xl font-black italic tracking-tighter leading-none">
                                JADDY <span className="text-purple-500">STUDIO</span>
                            </h1>
                            <span className="text-[9px] font-bold tracking-[0.2em] text-white/40 uppercase">Venta de Beats & Licencias</span>
                        </div>
                        
                        <div className="flex items-center gap-2 bg-black/40 p-1 rounded-full border border-white/5">
                            {['all', 'premium', 'free'].map((f) => (
                                <button 
                                    key={f}
                                    onClick={() => setFilter(f)}
                                    className={`px-5 py-2 rounded-full text-[10px] font-black uppercase transition-all ${filter === f ? 'bg-purple-600 text-white shadow-lg shadow-purple-600/30' : 'text-white/40 hover:text-white'}`}
                                >
                                    {f === 'all' ? 'Todo' : f === 'premium' ? 'Venta' : 'Free'}
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <section className="max-w-7xl mx-auto px-6 pt-16 pb-12">
                        <div className="max-w-3xl">
                            <h2 className="text-5xl md:text-7xl font-black italic uppercase tracking-tighter leading-[0.9] mb-6">
                                Potencia tu <span className="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-indigo-500">Música</span> con Calidad Profesional
                            </h2>
                            <p className="text-white/40 text-sm md:text-base font-medium max-w-xl">
                                {isOffline 
                                    ? "Estás navegando en modo local. Reconéctate para ver las últimas actualizaciones del catálogo." 
                                    : "Explora nuestro catálogo de instrumentales exclusivos. Compra licencias profesionales o descarga maquetas gratuitas."}
                            </p>
                        </div>
                    </section>

                    {/* Grid de Beats */}
                    <section className="max-w-7xl mx-auto px-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {loading ? (
                            Array(6).fill(0).map((_, i) => (
                                <div key={i} className="glass h-[450px] rounded-[32px] animate-pulse"></div>
                            ))
                        ) : filteredBeats.map((beat) => (
                            <div key={beat.id} className="beat-card glass rounded-[32px] p-5 transition-all duration-300 flex flex-col group">
                                <div className="relative aspect-square rounded-[24px] overflow-hidden mb-5 bg-zinc-900">
                                    <img 
                                        src={beat.image || 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?q=80&w=400&h=400&auto=format&fit=crop'} 
                                        className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700"
                                        loading="lazy"
                                    />
                                    {beat.audio && (
                                        <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-sm">
                                            <button 
                                                onClick={() => togglePlay(beat)}
                                                className="w-16 h-16 bg-white text-black rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-2xl"
                                            >
                                                <i className={`fa-solid ${currentId === beat.id && isPlaying ? 'fa-pause' : 'fa-play ml-1'} text-xl`}></i>
                                            </button>
                                        </div>
                                    )}
                                    <div className="absolute top-4 left-4">
                                        <span className={`px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest backdrop-blur-md border ${beat.category === 'free' ? 'bg-green-500/20 border-green-500/30 text-green-400' : 'bg-purple-500/20 border-purple-500/30 text-purple-400'}`}>
                                            {beat.category === 'free' ? 'Gratis' : 'Premium'}
                                        </span>
                                    </div>
                                </div>

                                <div className="flex justify-between items-start mb-4">
                                    <div className="overflow-hidden pr-2">
                                        <h3 className="text-xl font-black italic uppercase tracking-tight mb-1 truncate">{beat.name}</h3>
                                        <p className="text-[10px] font-bold text-white/30 uppercase tracking-widest">Prod by {beat.producer || 'Jaddy Records'}</p>
                                    </div>
                                    <div className="shrink-0">
                                        <span className="text-2xl font-black text-white italic">
                                            {beat.category === 'free' ? 'FREE' : `$${beat.price}`}
                                        </span>
                                    </div>
                                </div>

                                <div className="mt-auto grid grid-cols-2 gap-3">
                                    <button 
                                        onClick={() => togglePlay(beat)}
                                        disabled={!beat.audio}
                                        className={`flex items-center justify-center gap-2 h-12 rounded-2xl glass text-[10px] font-black uppercase tracking-widest transition-colors ${!beat.audio ? 'opacity-20 cursor-not-allowed' : 'hover:bg-white/10'}`}
                                    >
                                        <i className={`fa-solid ${currentId === beat.id && isPlaying ? 'fa-pause' : 'fa-play'}`}></i> Demo
                                    </button>
                                    <button 
                                        onClick={() => setSelectedBeat(beat)}
                                        className="flex items-center justify-center gap-2 h-12 rounded-2xl bg-white text-black hover:bg-purple-500 hover:text-white text-[10px] font-black uppercase tracking-widest transition-all shadow-lg"
                                    >
                                        <i className="fa-solid fa-cart-shopping"></i> Obtener
                                    </button>
                                </div>
                            </div>
                        ))}
                    </section>

                    {/* Modal de Pago */}
                    {selectedBeat && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/90 backdrop-blur-md" onClick={() => setSelectedBeat(null)}>
                            <div className="bg-[#0f0f0f] border border-white/10 w-full max-w-lg rounded-[40px] overflow-hidden p-8 md:p-12 relative" onClick={e => e.stopPropagation()}>
                                <button 
                                    onClick={() => setSelectedBeat(null)}
                                    className="absolute top-8 right-8 w-10 h-10 rounded-full glass flex items-center justify-center text-white/50 hover:text-white"
                                >
                                    <i className="fa-solid fa-xmark"></i>
                                </button>

                                <div className="flex items-center gap-6 mb-8">
                                    <div className="w-20 h-20 rounded-3xl overflow-hidden shadow-2xl bg-zinc-800">
                                        <img src={selectedBeat.image} className="w-full h-full object-cover" />
                                    </div>
                                    <div>
                                        <h4 className="text-2xl font-black italic uppercase tracking-tighter">{selectedBeat.name}</h4>
                                        <p className="text-xs font-bold text-purple-500 uppercase tracking-widest">{selectedBeat.category === 'free' ? 'Licencia Gratuita' : 'Licencia Comercial'}</p>
                                    </div>
                                </div>

                                <div className="space-y-6">
                                    <div className="p-6 bg-white/5 rounded-[24px] border border-white/5">
                                        <h5 className="text-[10px] font-black uppercase tracking-[0.2em] text-white/30 mb-3">Métodos de Pago:</h5>
                                        <p className="text-sm font-medium text-white/70 leading-relaxed whitespace-pre-line">
                                            {selectedBeat.paymentMethods || "Zelle, PayPal, Pago Móvil (Venezuela), Binance USDT."}
                                        </p>
                                    </div>

                                    <div className="flex flex-col gap-3">
                                        <a 
                                            href={`https://wa.me/584120000000?text=Hola Jaddy, quiero adquirir el beat: ${selectedBeat.name}`}
                                            target="_blank"
                                            className="flex items-center justify-center gap-3 w-full bg-green-600 hover:bg-green-500 h-14 rounded-2xl font-black uppercase text-xs tracking-[0.1em] transition-all"
                                        >
                                            <i className="fa-brands fa-whatsapp text-xl"></i> Contactar por WhatsApp
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Barra de Reproducción Mini */}
                    {currentId && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-xl z-[90]">
                            <div className="glass rounded-full p-2 flex items-center justify-between border border-white/10 shadow-2xl purple-glow">
                                <div className="flex items-center gap-3 pl-2 max-w-[60%]">
                                    <div className="w-10 h-10 rounded-full overflow-hidden shrink-0">
                                        <img src={beats.find(b => b.id === currentId)?.image} className="w-full h-full object-cover" />
                                    </div>
                                    <div className="truncate">
                                        <p className="text-[10px] font-black uppercase truncate">{beats.find(b => b.id === currentId)?.name}</p>
                                        <p className="text-[8px] font-bold text-white/40 uppercase">Reproduciendo Demo</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-4 pr-2">
                                    <button 
                                        onClick={() => togglePlay(beats.find(b => b.id === currentId))}
                                        className="w-10 h-10 bg-white text-black rounded-full flex items-center justify-center shadow-lg"
                                    >
                                        <i className={`fa-solid ${isPlaying ? 'fa-pause' : 'fa-play ml-0.5'}`}></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
