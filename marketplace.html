```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaddy Studio - Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #fff; }
        .beat-card { transition: all 0.3s ease; background: #0a0a0a; border: 1px solid rgba(255,255,255,0.05); }
        .beat-card:hover { border-color: #ea580c; transform: translateY(-4px); }
    </style>
</head>
<body class="pb-32">

    <header class="pt-16 pb-10 px-6 text-center">
        <h1 class="text-5xl font-black italic uppercase tracking-tighter">Jaddy <span class="text-orange-500">Studio</span></h1>
        <p class="text-[10px] font-bold text-neutral-500 uppercase tracking-widest mt-2">Marketplace de Beats</p>
    </header>

    <main class="max-w-6xl mx-auto px-6">
        <div id="marketplaceGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Los beats se cargarán aquí -->
            <p class="col-span-full text-center text-neutral-600 uppercase text-[10px] py-20 tracking-widest animate-pulse">Conectando con el estudio...</p>
        </div>
    </main>

    <!-- Reproductor -->
    <div id="player" class="fixed hidden bottom-6 left-6 right-6 bg-[#111] border border-white/10 p-6 rounded-[2rem] shadow-2xl z-50">
        <div class="flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="flex items-center gap-4 flex-1">
                <div class="w-12 h-12 bg-orange-600 rounded-xl flex items-center justify-center"><i data-lucide="music" class="text-white"></i></div>
                <div>
                    <h4 id="p-title" class="font-black uppercase text-sm">Título</h4>
                    <p id="p-prod" class="text-[10px] text-neutral-500 uppercase font-bold">Productor</p>
                </div>
            </div>
            <div id="p-media" class="flex-1 w-full text-center"></div>
            <div class="flex items-center gap-6">
                <p id="p-price" class="text-2xl font-black italic text-white">$0.00</p>
                <button id="p-buy" class="bg-white text-black px-8 py-3 rounded-xl font-black uppercase text-[10px] hover:bg-orange-600 hover:text-white transition-all">Comprar</button>
                <button onclick="document.getElementById('player').classList.add('hidden')" class="text-neutral-500"><i data-lucide="x"></i></button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'jaddy-studio-pro';

        let beats = [];

        const start = async () => {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                const ref = collection(db, 'artifacts', appId, 'public', 'data', 'beats');
                onSnapshot(ref, (snap) => {
                    beats = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    render();
                });
            }
        });

        function render() {
            const grid = document.getElementById('marketplaceGrid');
            if (beats.length === 0) {
                grid.innerHTML = '<p class="col-span-full text-center text-neutral-700 uppercase text-[10px] py-20">Sube pistas desde AdminBeats.html</p>';
                return;
            }
            grid.innerHTML = beats.map(b => `
                <div class="beat-card p-6 rounded-3xl flex flex-col">
                    <div class="flex justify-between items-start mb-6">
                        <div class="w-10 h-10 bg-white/5 rounded-lg flex items-center justify-center text-orange-500"><i data-lucide="disc"></i></div>
                        <span class="text-[9px] font-black uppercase bg-orange-600/10 text-orange-500 px-3 py-1 rounded-full">${b.genre}</span>
                    </div>
                    <h3 class="font-black uppercase italic text-xl truncate">${b.title}</h3>
                    <p class="text-[9px] font-bold text-neutral-500 uppercase mb-8">Prod. ${b.producer || 'Jaddy Studio'}</p>
                    <div class="mt-auto flex items-center justify-between">
                        <span class="text-2xl font-black italic">$${b.price}</span>
                        <button onclick="playBeat('${b.id}')" class="w-12 h-12 bg-white text-black rounded-xl flex items-center justify-center hover:bg-orange-600 hover:text-white transition-all shadow-lg">
                            <i data-lucide="play" class="fill-current ml-1"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.playBeat = (id) => {
            const b = beats.find(x => x.id === id);
            const player = document.getElementById('player');
            player.classList.remove('hidden');
            document.getElementById('p-title').innerText = b.title;
            document.getElementById('p-prod').innerText = `Prod. ${b.producer}`;
            document.getElementById('p-price').innerText = `$${b.price}`;
            
            const media = document.getElementById('p-media');
            if(b.type === 'youtube') {
                media.innerHTML = `<iframe width="200" height="80" src="https://www.youtube.com/embed/${b.url}?autoplay=1" frameborder="0" class="mx-auto rounded-lg"></iframe>`;
            } else {
                media.innerHTML = `<audio src="${b.url}" controls autoplay class="w-full h-8 invert opacity-80"></audio>`;
            }

            document.getElementById('p-buy').onclick = () => {
                const text = `Hola! Quiero comprar el beat: ${b.title}`;
                window.open(`https://wa.me/${b.whatsapp.replace(/\D/g,'')}?text=${encodeURIComponent(text)}`, '_blank');
            };
        };

        start();
    </script>
</body>
</html>
