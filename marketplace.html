            projectId: "jaddy-estudio",

        const app = initializeApp(firebaseConfig);

        let allBeats = [];
        let currentUser = null;

        onSnapshot(collection(db, 'beats'), (snap) => {
            allBeats = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(b => b.visible === true);
            render();
        });

        function render() {
            const g = document.getElementById('grid');
            g.innerHTML = allBeats.map((b, index) => `

                        <p class="text-[9px] font-bold text-neutral-600">PROD. ${b.producer || 'Jaddy Studio'}</p>
                    </div>
                    <div class="col-span-3 text-right font-black">$${b.price}</div>
                </div>
            `).join('');
        }
    </script>
