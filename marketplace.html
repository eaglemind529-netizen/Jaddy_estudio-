```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | Jaddy estudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #070707; color: white; overflow-x: hidden; }
        .gold-gradient { background: linear-gradient(135deg, #facc15 0%, #eab308 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.3s ease; }
        .glass-card:hover { border-color: rgba(234, 179, 8, 0.3); background: rgba(255, 255, 255, 0.04); }
        .admin-panel { background: #0f172a; border-left: 1px solid rgba(255,255,255,0.1); transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(100%); }
        .admin-panel.open { transform: translateX(0); }
        #youtube-player-container { position: absolute; width: 0; height: 0; pointer-events: none; opacity: 0; }
        #audio-player { transform: translateY(150%); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #audio-player.visible { transform: translateY(0); }
    </style>
</head>
<body class="pb-32">

    <div id="youtube-player-container"><div id="yt-engine"></div></div>

    <!-- NAVEGACIÓN -->
    <nav class="sticky top-0 z-[60] bg-black/80 backdrop-blur-xl border-b border-white/5 h-20 px-6 flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" onclick="toggleAdmin()">
            <div class="w-10 h-10 gold-gradient rounded-xl flex items-center justify-center shadow-lg shadow-yellow-500/20">
                <i class="fa-solid fa-lock text-black text-sm"></i>
            </div>
            <div class="flex flex-col leading-none">
                <span class="font-black uppercase tracking-tighter text-xl italic">Jaddy estudio</span>
                <span class="text-[9px] text-yellow-500 font-bold uppercase tracking-widest">Panel de Administración</span>
            </div>
        </div>
        <div class="hidden md:flex bg-white/5 p-1 rounded-2xl border border-white/5">
            <button onclick="switchView('marketplace')" class="px-6 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest text-yellow-500 bg-white/10 transition-all">Catálogo</button>
            <button onclick="switchView('vault')" class="px-6 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest text-gray-500 hover:text-white transition-all">Ventas</button>
        </div>
        <button onclick="location.href='index.html'" class="text-gray-500 hover:text-white text-xs font-black uppercase italic">Salir</button>
    </nav>

    <!-- PANEL DE ADMINISTRADORA (LATERAL) -->
    <aside id="admin-sidebar" class="fixed right-0 top-0 h-full w-full md:w-96 z-[100] admin-panel p-8 shadow-2xl">
        <div class="flex justify-between items-center mb-10">
            <h3 class="text-2xl font-black italic uppercase italic">Subir Nueva Pista</h3>
            <button onclick="toggleAdmin()" class="text-gray-500 hover:text-white"><i class="fa-solid fa-xmark text-2xl"></i></button>
        </div>
        
        <div class="space-y-6">
            <div>
                <label class="block text-[10px] font-black uppercase text-gray-500 mb-2 tracking-widest">Enlace de YouTube</label>
                <input id="admin-url" type="text" placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-black/50 border border-white/10 rounded-xl p-4 text-sm focus:border-yellow-500 outline-none transition-all">
            </div>
            <div>
                <label class="block text-[10px] font-black uppercase text-gray-500 mb-2 tracking-widest">Título de la Pista</label>
                <input id="admin-title" type="text" placeholder="Ej: Trap King 2024" class="w-full bg-black/50 border border-white/10 rounded-xl p-4 text-sm focus:border-yellow-500 outline-none transition-all">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-black uppercase text-gray-500 mb-2 tracking-widest">Precio ($)</label>
                    <input id="admin-price" type="number" placeholder="50" class="w-full bg-black/50 border border-white/10 rounded-xl p-4 text-sm focus:border-yellow-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase text-gray-500 mb-2 tracking-widest">Género</label>
                    <select id="admin-genre" class="w-full bg-black/50 border border-white/10 rounded-xl p-4 text-sm focus:border-yellow-500 outline-none transition-all appearance-none">
                        <option>Reggaeton</option>
                        <option>Trap</option>
                        <option>Drill</option>
                        <option>Dancehall</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-[10px] font-black uppercase text-gray-500 mb-2 tracking-widest">URL de Carátula (Imagen)</label>
                <input id="admin-img" type="text" placeholder="https://link-de-imagen.jpg" class="w-full bg-black/50 border border-white/10 rounded-xl p-4 text-sm focus:border-yellow-500 outline-none transition-all">
            </div>
            
            <button onclick="addTrackFromPanel()" class="w-full gold-gradient text-black font-black uppercase py-4 rounded-2xl shadow-xl shadow-yellow-500/20 hover:scale-[1.02] active:scale-[0.98] transition-all mt-4">
                Publicar en Marketplace
            </button>
        </div>
        
        <p class="mt-10 text-[9px] text-gray-600 font-bold uppercase text-center tracking-widest">
            Jaddy estudio | Doña Plataforma v1.0
        </p>
    </aside>

    <main class="max-w-7xl mx-auto p-8">
        <div id="view-marketplace" class="animate-view">
            <header class="mb-12">
                <h2 class="text-6xl font-black tracking-tighter italic uppercase leading-none">Marketplace</h2>
                <p class="text-gray-500 mt-2 font-medium">Gestión en tiempo real de instrumentales.</p>
            </header>
            <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10"></div>
        </div>
    </main>

    <!-- REPRODUCTOR -->
    <div id="audio-player" class="fixed bottom-10 left-1/2 -translate-x-1/2 w-[95%] max-w-4xl bg-black/90 backdrop-blur-3xl border border-white/10 p-6 rounded-[3rem] z-[100] shadow-2xl flex items-center justify-between px-10">
        <div class="flex items-center gap-6">
            <img id="player-img" src="" class="w-16 h-16 rounded-2xl object-cover ring-2 ring-yellow-500/50">
            <div>
                <h4 id="player-title" class="font-black text-xl tracking-tighter uppercase italic leading-none mb-1">Cargando...</h4>
                <span class="text-[9px] text-yellow-500 font-bold uppercase tracking-widest">Escuchando Demo</span>
            </div>
        </div>
        <div class="flex items-center gap-8">
            <button onclick="togglePlay()" class="bg-white text-black w-14 h-14 rounded-full flex items-center justify-center hover:scale-110 active:scale-90 transition-all">
                <i id="play-icon" class="fa-solid fa-play text-xl ml-1"></i>
            </button>
            <button onclick="closePlayer()" class="text-gray-600 hover:text-white transition-colors"><i class="fa-solid fa-xmark text-2xl"></i></button>
        </div>
    </div>

    <script>
        let ytPlayer;
        let isPlaying = false;
        let currentTrackId = null;

        // Base de datos local inicial (Doña Plataforma puede añadir más)
        let catalog = [
            { 
                id: Date.now(), 
                title: "Fuego Ártico", 
                price: 50, 
                genre: "Reggaeton", 
                image: "https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?w=400",
                url: "https://www.youtube.com/watch?v=dQw4w9WgXcQ" 
            }
        ];

        function toggleAdmin() {
            document.getElementById('admin-sidebar').classList.toggle('open');
        }

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length == 11) ? match[2] : null;
        }

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-engine', {
                height: '0', width: '0', videoId: '',
                playerVars: { 'autoplay': 0, 'controls': 0 },
                events: { 'onStateChange': (e) => {
                    isPlaying = (e.data == YT.PlayerState.PLAYING);
                    document.getElementById('play-icon').className = isPlaying ? "fa-solid fa-pause text-xl" : "fa-solid fa-play text-xl ml-1";
                }}
            });
        }

        function addTrackFromPanel() {
            const url = document.getElementById('admin-url').value;
            const title = document.getElementById('admin-title').value;
            const price = document.getElementById('admin-price').value;
            const genre = document.getElementById('admin-genre').value;
            const img = document.getElementById('admin-img').value || 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400';

            if(!url || !title || !price) return alert("Doña Plataforma, rellene los campos básicos.");

            const newTrack = {
                id: Date.now(),
                title: title,
                price: price,
                genre: genre,
                image: img,
                url: url
            };

            catalog.unshift(newTrack); // Añadir al principio
            renderMarket();
            toggleAdmin();
            
            // Limpiar campos
            document.getElementById('admin-url').value = '';
            document.getElementById('admin-title').value = '';
            document.getElementById('admin-price').value = '';
        }

        function playTrack(id) {
            const track = catalog.find(t => t.id === id);
            const videoId = extractVideoId(track.url);
            
            if (currentTrackId !== id) {
                ytPlayer.loadVideoById(videoId);
                document.getElementById('player-img').src = track.image;
                document.getElementById('player-title').innerText = track.title;
                currentTrackId = id;
            } else {
                togglePlay();
            }
            document.getElementById('audio-player').classList.add('visible');
        }

        function togglePlay() {
            if (isPlaying) ytPlayer.pauseVideo(); else ytPlayer.playVideo();
        }

        function closePlayer() {
            ytPlayer.stopVideo();
            document.getElementById('audio-player').classList.remove('visible');
            currentTrackId = null;
        }

        function renderMarket() {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = catalog.map(track => `
                <div class="glass-card rounded-[2.5rem] overflow-hidden group">
                    <div class="relative aspect-square">
                        <img src="${track.image}" class="w-full h-full object-cover opacity-50 group-hover:opacity-100 transition-all duration-500">
                        <button onclick="playTrack(${track.id})" class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all">
                            <div class="w-16 h-16 bg-white text-black rounded-full flex items-center justify-center shadow-2xl"><i class="fa-solid fa-play ml-1"></i></div>
                        </button>
                        <div class="absolute bottom-4 left-4 bg-yellow-500 text-black text-[8px] font-black px-2 py-1 rounded uppercase tracking-widest">${track.genre}</div>
                    </div>
                    <div class="p-6 flex justify-between items-center">
                        <div>
                            <h3 class="font-black text-lg uppercase italic leading-tight">${track.title}</h3>
                            <span class="text-2xl font-black text-white">$${track.price}</span>
                        </div>
                        <button class="bg-white/5 border border-white/10 hover:bg-white hover:text-black px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all">Comprar</button>
                    </div>
                </div>
            `).join('');
        }

        window.onload = renderMarket;
    </script>
</body>
</html>
