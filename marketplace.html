<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaddy Studio | Drive Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: white;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .accent-gradient {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
        }

        .text-gradient {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hide { display: none !important; }

        .playing-pulse {
            animation: pulse-purple 2s infinite;
            background: #a855f7 !important;
        }

        @keyframes pulse-purple {
            0% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(168, 85, 247, 0); }
            100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); }
        }

        .loading-spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen pb-32">

    <!-- Fondo -->
    <div class="fixed inset-0 -z-10">
        <div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-purple-600/10 blur-[120px] rounded-full"></div>
        <div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-indigo-600/10 blur-[120px] rounded-full"></div>
    </div>

    <!-- Nav -->
    <nav class="h-24 flex items-center justify-between px-8 sticky top-0 z-50 bg-black/40 backdrop-blur-xl border-b border-white/5">
        <div>
            <h1 class="text-2xl font-black italic tracking-tighter uppercase leading-none">
                JADDY <span class="text-purple-500 underline">STUDIO</span>
            </h1>
            <p class="text-[9px] font-bold text-gray-500 uppercase tracking-[0.3em] mt-1">Audio Drive Stream</p>
        </div>
        <div class="flex gap-2 bg-white/5 p-1 rounded-full border border-white/10">
            <button onclick="setFilter('all')" id="btn-all" class="px-5 py-2 rounded-full text-[10px] font-black uppercase transition-all bg-purple-600">Todos</button>
            <button onclick="setFilter('paid')" id="btn-paid" class="px-5 py-2 rounded-full text-[10px] font-black uppercase transition-all text-gray-400">Premium</button>
            <button onclick="setFilter('free')" id="btn-free" class="px-5 py-2 rounded-full text-[10px] font-black uppercase transition-all text-gray-400">Gratis</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 pt-16">
        <header class="mb-16">
            <h2 class="text-7xl md:text-9xl font-black italic uppercase tracking-tighter leading-[0.8] mb-6">
                BEAT <br> <span class="text-gradient">STORE</span>
            </h2>
            <div class="h-1 w-20 accent-gradient mb-6"></div>
        </header>

        <div id="beats-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <!-- Cargando desde Firebase... -->
        </div>
    </main>

    <!-- Reproductor Inferior (Barra de Control) -->
    <div id="player-bar" class="fixed bottom-0 left-0 w-full h-24 glass border-t border-white/10 z-[100] px-8 flex items-center justify-between translate-y-full transition-transform duration-500">
        <div class="flex items-center gap-4 w-1/3">
            <div class="w-12 h-12 rounded-xl bg-purple-600/20 flex items-center justify-center border border-purple-500/30">
                <svg class="w-6 h-6 text-purple-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"></path></svg>
            </div>
            <div>
                <p id="p-song-title" class="text-sm font-black uppercase italic truncate max-w-[200px]">Título del Beat</p>
                <p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest">Jaddy Studio</p>
            </div>
        </div>

        <div class="flex flex-col items-center w-1/3 gap-2">
            <div class="flex items-center gap-6">
                <button onclick="toggleMainPlay()" class="w-12 h-12 rounded-full accent-gradient flex items-center justify-center shadow-lg shadow-purple-500/20 active:scale-90 transition-all">
                    <svg id="main-play-icon" class="w-5 h-5 text-white fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                </button>
            </div>
            <div class="w-full max-w-md h-1 bg-white/10 rounded-full overflow-hidden">
                <div id="p-progress" class="h-full bg-purple-500 w-0 transition-all duration-100"></div>
            </div>
        </div>

        <div class="w-1/3 flex justify-end">
            <button onclick="closePlayer()" class="text-gray-500 hover:text-white transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="2" stroke-linecap="round"></path></svg>
            </button>
        </div>
    </div>

    <!-- Modal Checkout -->
    <div id="payment-modal" class="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/95 backdrop-blur-2xl hide">
        <div class="glass w-full max-w-lg rounded-[45px] overflow-hidden relative border border-white/10 p-12">
            <button onclick="closeModal()" class="absolute top-8 right-8 text-3xl text-gray-500">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- Audio Engine -->
    <audio id="main-audio-element"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, doc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDIaAvpJZrJjQUKsh6KGD7gALJNskto8A8",
            authDomain: "jaddy-estudio.firebaseapp.com",
            projectId: "jaddy-estudio",
            storageBucket: "jaddy-estudio.firebasestorage.app",
            messagingSenderId: "968903268866",
            appId: "1:968903268866:web:e2b6895e8acff18178e51b"
        };

        const APP_ID = "jaddy_studio_v1";
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let allBeats = [];
        let paymentInfo = {};
        let currentFilter = 'all';
        let currentPlayingId = null;

        const audio = document.getElementById('main-audio-element');
        const playerBar = document.getElementById('player-bar');
        const progress = document.getElementById('p-progress');

        // FUNCIÓN CLAVE: Convertir link de Drive a Direct Download
        const formatDriveLink = (url) => {
            if (url.includes('drive.google.com')) {
                const id = url.split('/d/')[1]?.split('/')[0] || url.split('id=')[1];
                return `https://docs.google.com/uc?export=download&id=${id}`;
            }
            return url;
        };

        window.togglePlay = (url, name, id) => {
            if (currentPlayingId === id) {
                toggleMainPlay();
                return;
            }

            const directUrl = formatDriveLink(url);
            audio.src = directUrl;
            audio.play().catch(e => console.error("Error reproduciendo Drive:", e));
            
            currentPlayingId = id;
            document.getElementById('p-song-title').innerText = name;
            playerBar.classList.remove('translate-y-full');
            updateUI();
        };

        window.toggleMainPlay = () => {
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
            updateUI();
        };

        const updateUI = () => {
            const playIcon = document.getElementById('main-play-icon');
            const gridIcons = document.querySelectorAll('.grid-play-btn');
            
            // Reset grid icons
            gridIcons.forEach(btn => {
                btn.innerHTML = `<svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>`;
                btn.classList.remove('playing-pulse');
            });

            if (!audio.paused) {
                playIcon.innerHTML = `<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>`;
                const activeBtn = document.getElementById(`btn-play-${currentPlayingId}`);
                if (activeBtn) {
                    activeBtn.innerHTML = `<svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>`;
                    activeBtn.classList.add('playing-pulse');
                }
            } else {
                playIcon.innerHTML = `<svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>`;
            }
        };

        audio.ontimeupdate = () => {
            const perc = (audio.currentTime / audio.duration) * 100;
            progress.style.width = perc + '%';
        };

        window.closePlayer = () => {
            audio.pause();
            playerBar.classList.add('translate-y-full');
            currentPlayingId = null;
            updateUI();
        };

        window.setFilter = (f) => {
            currentFilter = f;
            renderBeats();
            updateFilterButtons();
        };

        const updateFilterButtons = () => {
            ['all', 'paid', 'free'].forEach(f => {
                const btn = document.getElementById(`btn-${f}`);
                btn.className = f === currentFilter 
                    ? "px-5 py-2 rounded-full text-[10px] font-black uppercase transition-all bg-purple-600 text-white"
                    : "px-5 py-2 rounded-full text-[10px] font-black uppercase transition-all text-gray-400 hover:text-white";
            });
        };

        const renderBeats = () => {
            const grid = document.getElementById('beats-grid');
            grid.innerHTML = "";
            const filtered = allBeats.filter(b => {
                if (currentFilter === 'free') return b.type === 'free';
                if (currentFilter === 'paid') return b.type === 'paid';
                return true;
            });

            filtered.forEach(beat => {
                const card = document.createElement('div');
                card.className = "glass p-8 rounded-[40px] flex flex-col h-[480px] hover:border-purple-500/30 transition-all duration-500";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-8">
                        <button id="btn-play-${beat.id}" onclick="togglePlay('${beat.link}', '${beat.name}', '${beat.id}')" 
                                class="grid-play-btn w-16 h-16 rounded-2xl bg-white/5 flex items-center justify-center transition-all hover:bg-white/10">
                            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                        </button>
                        <div class="text-right">
                            <p class="text-[9px] font-black text-purple-500 uppercase tracking-widest mb-1">${beat.genre || 'TRAP'}</p>
                            <p class="text-4xl font-black italic tracking-tighter">${beat.type === 'free' ? 'FREE' : '$' + beat.price}</p>
                        </div>
                    </div>
                    <div class="mb-8">
                        <h3 class="text-3xl font-black uppercase italic leading-none truncate mb-2">${beat.name}</h3>
                        <p class="text-gray-500 text-[10px] font-bold uppercase tracking-[0.3em]">Official Release</p>
                    </div>
                    <div class="flex-1 bg-gradient-to-br from-white/5 to-transparent rounded-[30px] mb-8 border border-white/5 flex items-center justify-center">
                        <div class="text-center opacity-10">
                            <h2 class="text-3xl font-black italic">JADDY</h2>
                        </div>
                    </div>
                    <div class="flex gap-4">
                        <button onclick="openCheckout('${beat.id}')" class="flex-1 bg-white text-black py-4 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-gray-200 transition-all active:scale-95">
                            Adquirir Licencia
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        };

        window.openCheckout = (id) => {
            const beat = allBeats.find(b => b.id === id);
            const content = document.getElementById('modal-content');
            content.innerHTML = `
                <h4 class="text-3xl font-black italic uppercase mb-2">${beat.name}</h4>
                <p class="text-purple-500 text-[10px] font-black uppercase tracking-widest mb-10">Información de Adquisición</p>
                <div class="space-y-6 mb-10">
                    <div class="p-6 bg-white/5 rounded-3xl border border-white/10">
                        <span class="text-[9px] font-bold text-gray-500 uppercase block mb-2">Pago Móvil</span>
                        <p class="text-sm font-bold text-white">${paymentInfo.pago_movil || 'Consultar por WhatsApp'}</p>
                    </div>
                    <div class="flex justify-between px-2">
                        <span class="text-gray-400 font-bold uppercase text-[10px]">Total:</span>
                        <span class="text-2xl font-black text-white">$${beat.price || '0'} USD</span>
                    </div>
                </div>
                <a href="https://wa.me/584120000000?text=Hola Jaddy, quiero la licencia del beat: ${beat.name}" target="_blank" 
                   class="block w-full text-center bg-[#25D366] text-white py-5 rounded-2xl font-black uppercase text-xs shadow-lg shadow-green-500/10">
                   Enviar Comprobante WhatsApp
                </a>
            `;
            document.getElementById('payment-modal').classList.remove('hide');
        };

        window.closeModal = () => document.getElementById('payment-modal').classList.add('hide');

        const init = async () => {
            try {
                await signInAnonymously(auth);
                onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', 'beats'), (snap) => {
                    allBeats = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderBeats();
                });
                onSnapshot(doc(db, 'artifacts', APP_ID, 'public', 'data', 'payments'), (snap) => {
                    if(snap.exists()) paymentInfo = snap.data();
                });
            } catch (e) { console.error("Firebase Error:", e); }
        };

        init();
    </script>
</body>
</html>
