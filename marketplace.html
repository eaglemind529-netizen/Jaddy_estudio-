```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaddy Studio - Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #050505; color: #fff; }
        .beat-card { background: #0d0d0d; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .beat-card:hover { border-color: #ea580c; transform: translateY(-5px); }
        .glass { background: rgba(13, 13, 13, 0.8); backdrop-filter: blur(15px); border-top: 1px solid rgba(255,255,255,0.1); }
        /* Bloqueo de descarga en controles de audio nativos */
        audio::-internal-media-controls-download-button { display:none; }
        audio::-webkit-media-controls-enclosure { overflow:hidden; }
        audio::-webkit-media-controls-panel { padding-right: 20px; }
    </style>
</head>
<body class="pb-40">

    <header class="py-20 px-6 text-center">
        <h1 class="text-6xl md:text-8xl font-black italic uppercase tracking-tighter">THE <span class="text-orange-500">MARKET</span></h1>
        <p class="text-[10px] font-bold text-neutral-500 uppercase tracking-[0.5em] mt-2">Jaddy Studio Professional Production</p>
    </header>

    <main class="max-w-6xl mx-auto px-6">
        <div id="grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Se carga desde Firebase -->
        </div>
    </main>

    <!-- Reproductor Inferior -->
    <div id="player" class="hidden fixed bottom-6 left-4 right-4 md:left-10 md:right-10 z-[100] glass p-6 rounded-[2.5rem]">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row items-center gap-6">
            <div class="flex items-center gap-4 flex-1 w-full">
                <div class="w-12 h-12 bg-orange-600 rounded-xl flex items-center justify-center text-white"><i data-lucide="music-2"></i></div>
                <div class="min-w-0">
                    <h4 id="pt" class="text-sm font-black uppercase text-white truncate italic tracking-tight">---</h4>
                    <p id="pp" class="text-[9px] font-bold text-neutral-500 uppercase">PROD. ---</p>
                </div>
            </div>
            
            <div id="pm" class="w-full md:w-1/3">
                <!-- El audio/video se inyecta aquí -->
            </div>

            <div class="flex items-center gap-6 w-full md:w-auto justify-between md:justify-end">
                <span id="pr" class="text-3xl font-black italic text-white">$0</span>
                <button id="pb" class="bg-white text-black px-8 py-3 rounded-xl font-black uppercase text-[10px] tracking-widest hover:bg-orange-600 hover:text-white transition-all">COMPRAR</button>
                <button onclick="document.getElementById('player').classList.add('hidden')" class="text-neutral-500"><i data-lucide="x"></i></button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDIaAvpJZrJjQUKsh6KGD7gALJNskto8A8",
            authDomain: "jaddy-estudio.firebaseapp.com",
            projectId: "jaddy-estudio",
            storageBucket: "jaddy-estudio.firebasestorage.app",
            messagingSenderId: "968903268866",
            appId: "1:968903268866:web:e2b6895e8acff18178e51b",
            measurementId: "G-SBBXXDD3TV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let beats = [];

        signInAnonymously(auth).then(() => {
            onSnapshot(collection(db, 'beats'), (snap) => {
                beats = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                render();
            });
        });

        function render() {
            const g = document.getElementById('grid');
            if(beats.length === 0) { 
                g.innerHTML = '<p class="col-span-full text-center text-neutral-800 font-black uppercase text-xs py-20">Sin beats disponibles en el estudio</p>'; 
                return; 
            }
            g.innerHTML = beats.map(b => `
                <div class="beat-card p-8 rounded-[2.5rem] flex flex-col group relative">
                    <!-- Botón de Opciones para WhatsApp -->
                    <button onclick="window.requestByWhatsApp('${b.id}')" class="absolute top-6 right-6 text-neutral-600 hover:text-orange-500 transition-colors p-2">
                        <i data-lucide="more-vertical"></i>
                    </button>

                    <div class="flex justify-between items-start mb-10">
                        <div class="w-10 h-10 bg-white/5 rounded-xl flex items-center justify-center text-neutral-600 group-hover:text-orange-500 transition-colors"><i data-lucide="music"></i></div>
                        <span class="text-[9px] font-black uppercase text-orange-500 bg-orange-500/10 px-3 py-1 rounded-lg border border-orange-500/10">${b.genre || 'BEAT'}</span>
                    </div>
                    <h3 class="text-xl font-black uppercase italic text-white mb-1 truncate">${b.title}</h3>
                    <p class="text-[9px] font-bold text-neutral-600 uppercase mb-8">PROD. ${b.producer || 'Jaddy Studio'}</p>
                    <div class="mt-auto flex items-center justify-between border-t border-white/5 pt-6">
                        <span class="text-3xl font-black italic">$${b.price}</span>
                        <button onclick="window.play('${b.id}')" class="w-12 h-12 bg-white text-black rounded-xl flex items-center justify-center hover:bg-orange-600 hover:text-white transition-all shadow-lg"><i data-lucide="play" class="fill-current ml-1"></i></button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // Función con el mensaje automatizado personalizado
        window.requestByWhatsApp = (id) => {
            const b = beats.find(x => x.id === id);
            // Mensaje personalizado solicitado
            const text = `🔥 ¡Hola Jaddy Studio! Estoy muy interesado en solicitar esta pista: "${b.title}". Me encanta el estilo y el nombre, ¿podrías darme más información para adquirirla?`;
            const phone = b.whatsapp ? b.whatsapp.replace(/\D/g,'') : '584120000000'; // Fallback a tu número si no hay
            window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`, '_blank');
        };

        window.play = (id) => {
            const b = beats.find(x => x.id === id);
            const p = document.getElementById('player');
            p.classList.remove('hidden');
            document.getElementById('pt').innerText = b.title;
            document.getElementById('pp').innerText = `PROD. ${b.producer || 'Jaddy Studio'}`;
            document.getElementById('pr').innerText = `$${b.price}`;
            const m = document.getElementById('pm');
            
            if(b.type === 'youtube') {
                m.innerHTML = `<iframe width="100%" height="60" src="https://www.youtube.com/embed/${b.url}?autoplay=1" frameborder="0" class="rounded-xl shadow-lg"></iframe>`;
            } else {
                // Protección contra descarga habilitada
                m.innerHTML = `<audio src="${b.url}" controls autoPlay controlsList="nodownload" oncontextmenu="return false;" class="w-full h-8 invert opacity-70"></audio>`;
            }

            document.getElementById('pb').onclick = () => window.requestByWhatsApp(b.id);
            lucide.createIcons();
        };

        lucide.createIcons();
    </script>
</body>
</html>
