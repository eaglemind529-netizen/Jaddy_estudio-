        const firebaseConfig = {

            authDomain: "jaddy-estudio.firebaseapp.com",
            projectId: "jaddy-estudio",
            storageBucket: "jaddy-estudio.firebasestorage.app",
            messagingSenderId: "968903268866",
            appId: "1:968903268866:web:e2b6895e8acff18178e51b",
            measurementId: "G-SBBXXDD3TV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let allBeats = [];
        let currentFilter = 'all';
        let selectedBeat = null;
        let selectedMode = 'contado';

        // LÓGICA DE COMPARTIR AÑADIDA
        window.shareCatalog = () => {
            const shareData = {
                title: 'Jaddy Studio Marketplace',
                text: 'Mira el catálogo de beats profesionales de Jaddy Studio:',

            };
            if (navigator.share) {

            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("¡Enlace del catálogo copiado al portapapeles!");
            }
        };

        signInAnonymously(auth).then(() => {
            onSnapshot(collection(db, 'beats'), (snap) => {
                allBeats = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).filter(b => b.visible === true);
                render();
            });
        });

        window.filterBeats = (filter) => {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`filter-${filter}`).classList.add('active');
            render();
        };

        function render() {
            const g = document.getElementById('grid');
            const filtered = allBeats.filter(b => currentFilter === 'all' || b.category === currentFilter);
            g.innerHTML = filtered.map((b, index) => `
                <div class="beat-row grid grid-cols-12 gap-4 items-center px-6 py-4 cursor-pointer group" onclick="window.play('${b.id}')">
                    <div class="col-span-1"><span class="text-[10px] font-mono text-neutral-700">${index + 1}</span></div>
                    <div class="col-span-8 md:col-span-5 flex flex-col min-w-0">
                        <h3 class="text-xs md:text-sm font-black uppercase italic text-white group-hover:text-orange-500 transition-colors truncate">${b.title}</h3>
                        <p class="text-[9px] font-bold text-neutral-600 uppercase">PROD. ${b.producer || 'Jaddy Studio'}</p>
                    </div>
                    <div class="hidden md:col-span-2 md:flex"><span class="text-[8px] font-black px-2 py-0.5 rounded border ${b.category === 'exclusiva' ? 'border-orange-500 text-orange-500' : 'border-blue-500 text-blue-500'} uppercase tracking-widest italic">${b.category === 'exclusiva' ? 'Exclusiva' : 'Licencia'}</span></div>
                    <div class="hidden md:col-span-1 md:flex"><span class="text-[9px] font-black text-neutral-500 uppercase tracking-tighter">${b.genre || 'BEAT'}</span></div>
                    <div class="col-span-3 flex items-center justify-end gap-4"><div class="flex flex-col items-end"><span class="text-sm md:text-lg font-black italic text-white leading-none">$${b.price}</span></div><button onclick="event.stopPropagation(); window.initPurchase('${b.id}')" class="bg-orange-600/10 text-orange-500 p-2 rounded hover:bg-orange-600 hover:text-white transition-all"><i data-lucide="shopping-cart" class="w-4 h-4"></i></button></div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        window.play = (id) => {
            const b = allBeats.find(x => x.id === id);
            selectedBeat = b;
            document.getElementById('player').classList.remove('hidden');
            document.getElementById('pt').innerText = b.title;
            document.getElementById('pp').innerText = `PROD. ${b.producer || 'Jaddy Studio'}`;
            document.getElementById('pr').innerText = `$${b.price}`;
            const badge = document.getElementById('playerBadge');
            badge.innerText = b.category === 'exclusiva' ? 'Exclusiva' : 'Licencia';
            badge.className = `text-[7px] border ${b.category === 'exclusiva' ? 'border-orange-500 text-orange-500' : 'border-blue-500 text-blue-500'} px-1 rounded font-bold uppercase`;
            const descCont = document.getElementById('descContainer');
            if(b.description && b.description.trim() !== "") { descCont.classList.remove('hidden'); document.getElementById('pDesc').innerText = b.description; } else { descCont.classList.add('hidden'); }
            const toggle = document.getElementById('paymentToggle');
            if(b.saleType === 'ambos') { toggle.classList.remove('hidden'); window.switchMode('contado'); } else { toggle.classList.add('hidden'); window.switchMode(b.saleType === 'credito' ? 'credito' : 'contado'); }
            if(b.saleType !== 'contado') { const count = parseInt(b.installmentsCount) || 1; const inicial = parseFloat(b.downPayment) || 0; const cuota = ((b.price - inicial) / count).toFixed(2); document.getElementById('crInitial').innerText = `$${inicial}`; document.getElementById('crInstallment').innerText = `$${cuota}`; document.getElementById('crInstallmentLabel').innerText = `${count} Cuotas`; }
            document.getElementById('pm').innerHTML = b.type === 'youtube' ? `<iframe width="100%" height="45" src="https://www.youtube.com/embed/${b.url}?autoplay=1" frameborder="0" class="rounded-lg"></iframe>` : `<audio src="${b.url}" controls autoPlay class="w-full h-8 invert opacity-70"></audio>`;
            document.getElementById('pb').onclick = () => window.initPurchase(b.id);
            lucide.createIcons();
        };

        window.switchMode = (mode) => {
            if(!selectedBeat) return;
            selectedMode = mode;
            document.getElementById('tabContado').className = `px-4 py-2 rounded-lg text-[9px] font-black uppercase tracking-widest transition-all ${mode === 'contado' ? 'tab-active' : 'text-neutral-500'}`;
            document.getElementById('tabCredito').className = `px-4 py-2 rounded-lg text-[9px] font-black uppercase tracking-widest transition-all ${mode === 'credito' ? 'tab-active' : 'text-neutral-500'}`;
            document.getElementById('priceDisplay').classList.toggle('hidden', mode === 'credito');
            document.getElementById('creditDisplay').classList.toggle('hidden', mode === 'contado');
        };

        window.initPurchase = (id) => { selectedBeat = allBeats.find(x => x.id === id); document.getElementById('purchaseModal').classList.remove('hidden'); setTimeout(() => document.getElementById('modalContent').classList.remove('scale-95'), 10); };
        window.closeModal = () => document.getElementById('purchaseModal').classList.add('hidden');

        document.getElementById('confirmPurchaseBtn').onclick = async () => {
            const artist = document.getElementById('artistNameInput').value.trim();
            if(!artist) return;
            const msg = `¡Hola Jaddy Studio! Soy "${artist}". Me interesa: "${selectedBeat.title}" (${selectedBeat.category.toUpperCase()}) en modalidad ${selectedMode.toUpperCase()}.`;
            window.open(`https://wa.me/${selectedBeat.whatsapp.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`, '_blank');
            closeModal();
        };

        lucide.createIcons();
    </script>
</body>
